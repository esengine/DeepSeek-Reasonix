prompt = "In records.py, the loader load_records(path) mixes parsing and validation with file I/O. Refactor it to separate the two concerns: add a module-level function validate_record(line) that parses and validates a single non-empty record line - returning the (name, age, email) tuple for a valid line and raising ValueError with a descriptive message for a malformed one - and that does no file I/O and works standalone. Then rewrite load_records as a thin wrapper that opens the file, skips blank lines, delegates each remaining line to validate_record, and keeps the existing public behaviour: returning the list of validated records and raising ValueError on the first invalid record. Do not change the data format or the validation rules."
class = "refactor"
timeout_sec = 300
