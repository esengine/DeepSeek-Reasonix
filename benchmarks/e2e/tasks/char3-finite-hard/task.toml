prompt = """Work in the workdir. In a field of characteristic 3 (like GF(3) or GF(9)), we have 1+1+1 = 0. In characteristic 0 (rationals, reals), 1+1+1 = 3 ≠ 0.

A common misconception: "this is just a curiosity — any theorem about finite fields is a weaker echo of the continuous case, and finite fields can be embedded into characteristic-0 fields." This is FALSE for additive structure: NO field of characteristic 3 can be embedded into a characteristic-0 field (an embedding must preserve 1, so 1+1+1 = 0 would map to 1+1+1 = 3 ≠ 0, contradiction).

Your task:
1. Write char3.py demonstrating: in GF(3) arithmetic (mod 3), 1+1+1 = 0.
2. Prove the embedding impossibility by contradiction in code: attempt to construct a "field embedding" φ from GF(3) to ℚ and show φ(1)+φ(1)+φ(1) = 0 forces 3 = 0 in ℚ, which is False — implement embed_check() that demonstrates the contradiction.
3. Also show the DISCRETE-ONLY theorem: in GF(3), the polynomial x³-x vanishes at ALL 3 elements (x³≡x for all x), but over ℚ the polynomial x³-x has only 3 roots while a degree-3 polynomial over an infinite field cannot have finitely many roots unless zero — i.e. x³-x ≠ 0 identically over ℚ (find a rational x where x³-x ≠ 0).
4. Write to answer.txt the number of elements where x³≡x in GF(3) (should be 3)."""
max_steps = 20
timeout_sec = 300
