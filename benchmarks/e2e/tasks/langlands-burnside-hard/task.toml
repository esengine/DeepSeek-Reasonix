prompt = """Write a Python script langlands.py in the workdir that re-derives the machine-verified Burnside checks of the Sovereign Langlands framework (Langlands.agda: A₄ + S₄ dual instances, GL₂(GF(9)) subgroups, 0 postulate, L3 (GL2TestVectors.agda: GL₂(5760) ℤ orthogonality)).

