1. S₄ Burnside: 1·1 + 1·1 + 2·2 + 3·3 + 3·3 ≡ 24 (s4-burnside = refl). The conjugacy classes of S₄ have sizes 1, 1, 2, 3, 3 with class sizes squared summing to 24 — this is the Burnside/class-equation check.
2. A₄ Burnside: the 12-element alternating group has conjugacy classes 1+3+4+4 = 12 (from A4Group.agda).
3. Langlands instance: A₄ (12) + S₄ (24) are two independent GL₂(GF(9)) subgroup Burnside verifications.
4. The general Langlands functoriality is NOT proven (TypeError: OnlyA4Instance).

Write langlands.py that:
