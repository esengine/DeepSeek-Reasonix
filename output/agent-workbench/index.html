<main class="main"><header class="top"><div><h1 id="taskTitle">准备一份行业研究</h1><div class="subtitle">通用助手 <span style="margin:0 7px">/</span> <span id="modelTitle">演示模型</span></div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge" id="status">需要你回答</span><button class="small plan-toggle hidden" id="togglePlan">计划</button></div></header><div class="chat" id="chat" aria-live="polite"></div><div class="composer-wrap"><form class="composer" id="composer"><div class="attachments" id="attachments"></div><textarea id="input" rows="2" aria-label="发送消息" placeholder="直接回答，或者补充你的想法…"></textarea><div class="composer-bottom"><div style="display:flex;gap:4px;align-items:center"><button type="button" id="attach" aria-label="添加附件">＋ 附件</button><select id="model" aria-label="选择模型"><option>演示模型</option></select><button type="button" id="modelSettings" aria-label="配置模型">⚙</button></div><button class="primary" type="submit" id="send">发送 ↑</button></div></form><div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 随时补充要求或调整方向</div></div></main>
<aside class="right"><div class="right-title">任务空间 <span class="tag" id="planCount">0 / 4</span></div><h3>执行计划 <button class="small" style="float:right;padding:0" id="editPlan">编辑</button></h3><ol class="plan" id="plan"></ol><div class="aside-section"><h3>已确认的上下文</h3><div id="context"></div></div><div class="aside-section"><h3>成果 <span id="artifactCount" class="subtitle">0</span></h3><div id="artifacts" class="empty">成果会留在这里。<br>无需回翻聊天记录。</div></div><div class="right-note">对话承接你的意图。<br>计划、上下文与成果随任务更新。</div></aside>

<input type="file" id="file" class="hidden" multiple>
<dialog class="modal" id="dialog"><div class="modal-header"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">✕</button></div><div class="modal-content" id="dialogBody"></div><div class="modal-footer" id="dialogFooter"></div></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
(()=>{
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenes={research:{title:'准备一份行业研究',request:'帮我研究一下 AI 个人助手的发展方向，整理成一份适合团队讨论的简报。',intro:'可以。我会把产品方向、典型场景和机会点整理在一起。先确认一个会影响研究重点的问题。',question:'这份简报主要用来做什么？',options:[['探索产品机会','重点看用户需求、使用场景和差异化方向'],['了解行业现状','重点看代表产品、能力边界和发展趋势'],['支持技术选型','重点看模型、工具接入和实现方式']],steps:['确认研究重点','收集并整理资料','形成观点与对比','交付研究简报'],tool:'读取公开资料',permission:'连接你的团队知识库？',permissionDesc:'读取你选择的「产品研究」目录，补充已有讨论。不会修改或分享文件。',blocked:'有一份参考资料无法访问',result:'AI 个人助手 · 方向研究',extension:'研究简报'},travel:{title:'安排一次京都旅行',request:'帮我安排一个轻松的京都三日行程，想吃好吃的，也想逛一些安静的地方。',intro:'我会把路线、餐饮和休息时间一起考虑。先了解你喜欢的节奏。',question:'你更喜欢哪一种旅行节奏？',options:[['慢慢逛','每天 2–3 个地点，留出自由时间'],['经典路线','覆盖主要景点，兼顾特色街区'],['当地生活','小店、咖啡馆和人少的地方']],steps:['确认旅行偏好','整理地点与路线','补充时间安排','交付三日行程'],tool:'整理目的地信息',permission:'读取日历中的出行日期？',permissionDesc:'仅查看这次旅行对应的日期，避开已有安排。不会创建或修改日程。',blocked:'一个地点的信息暂时不可用',result:'京都三日 · 慢旅行计划',extension:'旅行计划'},code:{title:'制作个人作品集',request:'帮我做一个个人作品集网站，简洁一点，方便展示我的项目。',intro:'我会先整理结构，再制作页面并检查效果。先确定网站最重要的内容。',question:'你希望访客最先看到什么？',options:[['项目作品','以作品封面与项目介绍为核心'],['个人介绍','强调你的经历、能力和表达'],['联系与合作','突出服务内容和合作入口']],steps:['确认网站重点','规划页面与内容','实现并检查页面','交付预览与文件'],tool:'整理页面结构',permission:'允许在项目目录中生成文件？',permissionDesc:'只在 portfolio/ 目录新增页面和样式文件，不覆盖已有文件。',blocked:'一张作品封面图片无法读取',result:'个人作品集 · 页面方案',extension:'设计方案'}};
let scene='research', stage='ask', choice=0, answer='', history='', timer=null, tick=0, paused=false, runTarget='approval', files=[], extraContext='', profile=null, toolProfiles=[], planCustom=null;
let stateNames={ask:'需要你回答',plan:'计划已就绪',running:'正在推进',approval:'需要你的授权',blocked:'需要你处理',done:'已完成'};
function agent(html){return '<section class="message"><div class="byline"><span class="agentmark">r</span>Reasonix <span class="subtitle">· 通用助手</span></div>'+html+'</section>'}
function user(text){return '<div class="message user"><div class="bubble">'+esc(text)+'</div></div>'}
function button(action,label,primary=false){return '<button data-action="'+action+'" class="'+(primary?'primary':'secondary')+'">'+label+'</button>'}
function receipt(text){return '<details class="receipt"><summary>'+esc(text)+'</summary><p>这条记录已保留。你可以在下方对话中随时补充或修改要求。</p></details>'}
function initial(){const s=scenes[scene];return '<div class="date">今天 · 一段持续推进的协作</div>'+user(s.request)}
function card(eyebrow,title,body,footer=''){return '<div class="interaction"><div class="interaction-body"><div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2>'+body+'</div>'+(footer?'<div class="interaction-footer">'+footer+'</div>':'')+'</div>'}
function render(){const s=scenes[scene];$('taskTitle').textContent=s.title;$('status').textContent=paused?'已暂停':stateNames[stage];$('jump').value=stage;$('currentTask').innerHTML=esc(s.title)+'<small>'+esc(paused?'已暂停':stateNames[stage])+'</small>';let content='';
if(stage==='ask')content=agent('<p class="copy">'+s.intro+'</p>'+card('ASK / 需要你回答',s.question,'<div class="choices">'+s.options.map((o,i)=>'<button class="choice '+(choice===i?'selected':'')+'" data-choice="'+i+'" aria-pressed="'+(choice===i)+'"><span class="radio"></span><span><b>'+o[0]+'</b><small>'+o[1]+'</small></span></button>').join('')+'</div>','<span>不必拘泥于选项，也可以直接回复</span>'+button('answer','就按这个方向 →',true)));
if(stage==='plan')content=agent('<p class="copy">明白，重点是「'+esc(answer||s.options[0][0])+'」。我已经更新右侧计划，接下来会按这个方向推进。</p>'+card('TODO / 计划就绪','先看清路径，再开始','<div class="muted">'+(planCustom||s.steps).slice(1).map((x,i)=>'<div style="padding:5px 0">'+(i+1)+'. '+esc(x)+'</div>').join('')+'</div>','<span>执行过程中仍然可以调整</span><div>'+button('edit','调整计划')+' '+button('start','开始执行 →',true)+'</div>'));
if(stage==='running')content=agent('<p class="copy">'+(paused?'进度已保存。准备好后可以继续，也可以告诉我需要调整什么。':'我正在推进任务。你可以继续补充要求，不需要等待我结束。')+'</p>'+card('RUNNING / '+(paused?'已暂停':'执行中'),paused?'任务已暂停':s.tool,'<div class="runline"><span class="'+(paused?'dot':'pulse')+'"></span><span id="runText">'+(paused?'等待继续':'正在整理第 '+(tick+1)+' 组信息')+'</span></div><div class="progress"><i style="width:'+Math.min(90,20+tick*20)+'%"></i></div><details class="trace"><summary>查看执行记录</summary><div>✓ 已载入任务上下文</div><div>✓ 已准备所需能力</div><div>◌ '+s.tool+'（模拟）</div></details>','<span>进展在这里更新，不刷满对话</span>'+button(paused?'resume':'pause',paused?'继续执行':'暂停')));
if(stage==='approval')content=agent('<p class="copy">下一步可以结合你的资料，让结果更贴近实际。这需要你授权，也可以跳过。</p>'+card('APPROVAL / 由你决定',s.permission,'<p class="muted">'+s.permissionDesc+'</p><div class="notice">仅本次任务有效 · 本原型不会调用真实服务</div>','<span>拒绝后仍可使用公开资料继续</span><div>'+button('deny','跳过')+' '+button('allow','允许这一次',true)+'</div>'));
if(stage==='blocked')content=agent('<p class="copy">大部分内容已经整理好。有一项信息需要换一种方式获取，现有进度已保留。</p>'+card('BLOCKED / 可以恢复',s.blocked,'<p class="muted">演示原因：外部服务暂时没有响应。你可以重试，或跳过这一项继续。</p>','<span>不会重新开始整个任务</span><div>'+button('skip','跳过这项')+' '+button('retry','重试连接',true)+'</div>'));
if(stage==='done')content=agent('<p class="copy">已经整理好了。成果留在右侧，你可以直接打开，也可以继续告诉我哪里需要调整。</p>'+card('DONE / 已交付',s.result,'<p class="muted">包含目标、核心内容与下一步建议。<br>这是用于体验交付流程的示例内容。</p>','<span>第 1 版 · 可继续迭代</span><div>'+button('download','下载')+' '+button('preview','打开成果 ↗',true)+'</div>'));
$('chat').innerHTML=history+content;renderAside();$('input').placeholder=stage==='ask'?'直接回答，或者补充你的想法…':stage==='done'?'继续修改：比如「更简洁一些」…':'补充要求、改变方向，或者问问当前进展…';}
function renderAside(){const s=scenes[scene],n=stage==='ask'?0:stage==='done'?4:stage==='blocked'?2:1;$('planCount').textContent=n+' / 4';$('plan').innerHTML=(planCustom||s.steps).map((x,i)=>'<li class="'+(i<n?'done':i===n?'current':'pending')+'"><span class="stepnum">'+(i<n?'✓':i+1)+'</span><div>'+esc(x)+(i===n?'<small>'+(paused?'已暂停':stage==='ask'?'等你确认方向':stateNames[stage])+'</small>':'')+'</div></li>').join('');$('context').innerHTML='<div class="context-item"><span>工作重点</span><b>'+esc(answer||'待确认')+'</b></div><div class="context-item"><span>输出语言</span><b>中文</b></div>'+(extraContext?'<div class="context-item"><span>补充要求</span><b>'+esc(extraContext)+'</b></div>':'');$('artifactCount').textContent=stage==='done'?'1':'0';$('artifacts').innerHTML=stage==='done'?'<button class="artifact" data-action="preview">▤ &nbsp; '+s.result+'<small>可预览 · 可下载 · 可继续修改 ↗</small></button>':'成果会留在这里。<br>无需回翻聊天记录。';}
function transition(next){clearInterval(timer);timer=null;paused=false;stage=next;render();$('chat').scrollTop=$('chat').scrollHeight;}
function reset(){clearInterval(timer);answer='';extraContext='';choice=0;files=[];planCustom=null;tick=0;paused=false;$('attachments').textContent='';history=initial();transition('ask');}
function start(target='approval'){tick=0;runTarget=target;transition('running');schedule();}
function schedule(){clearInterval(timer);timer=setInterval(()=>{tick++;if(tick>=4){history+=agent(receipt('✓ 已完成当前阶段 · 执行记录已收起'));transition(runTarget)}else{const label=$('runText');if(label)label.textContent='正在整理第 '+(tick+1)+' 组信息';const bar=$('chat').querySelector('.progress i');if(bar)bar.style.width=Math.min(90,20+tick*20)+'%';document.dispatchEvent(new CustomEvent('studio-progress',{detail:{tick}}));}},2200)}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function modal(title,body,footer){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogFooter').innerHTML=footer||'<button data-close class="secondary">关闭</button>';if(!$('dialog').open)$('dialog').showModal();}
function edit(){modal('调整执行计划','<p class="muted">每行一个步骤。此原型保留四个阶段，修改后会同步到任务空间。</p><textarea id="planEditor" rows="6">'+esc((planCustom||scenes[scene].steps).join('\n'))+'</textarea>','<button data-close>取消</button>'+button('savePlan','保存计划',true));}
function documentText(){const s=scenes[scene];return '# '+s.result+'\n\n> 交互原型示例，不是实际研究或执行结果。\n\n## 目标\n'+s.request+'\n\n## 已确认方向\n'+(answer||s.options[0][0])+'\n\n## 核心内容\n'+(scene==='research'?'1. 从单次回答转向持续完成任务。\n2. 把澄清、授权和交付变成清晰的交互节点。\n3. 模型与工具独立接入，任务上下文保持连续。':scene==='travel'?'第一天：抵达与附近街区漫步。\n第二天：安排一条步行路线，中午留出休息时间。\n第三天：自由探索，提前预留返程时间。':'首页：个人介绍与精选作品。\n项目：作品封面、过程与结果。\n联系：合作方式与联系方式。')+'\n\n## 补充要求\n'+(extraContext||'暂无')+'\n\n## 下一步\n确认内容后继续细化。';}
function preview(){modal(scenes[scene].result,'<article class="document">'+documentText().split('\n').map(l=>l.startsWith('# ')?'<h2>'+esc(l.slice(2))+'</h2>':l.startsWith('## ')?'<h3>'+esc(l.slice(3))+'</h3>':'<p>'+esc(l)+'</p>').join('')+'</article>','<button data-close>返回对话</button>'+button('download','下载 Markdown',true));}
function download(){const url=URL.createObjectURL(new Blob([documentText()],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=scenes[scene].result+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function connections(tab='model'){modal('连接与能力','<div class="tabs"><button data-tab="model" class="'+(tab==='model'?'selected':'')+'">模型 API</button><button data-tab="tool" class="'+(tab==='tool'?'selected':'')+'">工具与外部服务</button></div><p class="muted">'+(tab==='model'?'模型负责理解与规划。不同协议通过适配器接入，工作台的对话和状态保持一致。':'工具负责执行操作。HTTP API、MCP 和自定义适配器独立于模型配置。')+'</p><div class="notice">配置交互演示：不会连接服务，也不保存密钥。请勿填写真实凭证。</div><label for="providerName">连接名称</label><input id="providerName" placeholder="'+(tab==='model'?'例如：我的模型服务':'例如：团队知识库')+'" value="'+esc(tab==='model'&&profile?profile.name:'')+'"><div class="form-grid"><div><label for="protocol">'+(tab==='model'?'API 协议':'接入方式')+'</label><select id="protocol">'+(tab==='model'?'<option>OpenAI 兼容</option><option>Anthropic Messages</option><option>自定义适配器</option>':'<option>HTTP API</option><option>MCP</option><option>自定义适配器</option>')+'</select></div><div><label for="modelId">'+(tab==='model'?'模型标识':'能力名称')+'</label><input id="modelId" placeholder="'+(tab==='model'?'provider/model-name':'search_documents')+'" value="'+esc(tab==='model'&&profile?profile.id:'')+'"></div></div><label for="endpoint">服务地址</label><input id="endpoint" type="url" placeholder="https://api.example.com/v1" value="'+esc(tab==='model'&&profile?profile.endpoint:'')+'"><label for="auth">认证方式</label><select id="auth"><option>Bearer Token（运行时从凭证库读取）</option><option>API Key 请求头</option><option>OAuth</option><option>无需认证</option></select><details class="trace"><summary>适配与能力声明</summary><p class="muted">不同 API 需要适配请求、响应和事件结构，不能只替换地址。以下为配置界面示例。</p><label for="mapping">适配器标识</label><input id="mapping" placeholder="例如：my-provider-adapter"><label><input style="width:auto" type="checkbox" checked> 支持流式输出 / 进度事件</label><label><input style="width:auto" type="checkbox" checked> 支持工具调用 / 结构化结果</label></details>'+(toolProfiles.length?'<p class="muted">已添加工具：'+toolProfiles.map(esc).join('、')+'</p>':''),'<button data-close>取消</button><button class="primary" data-save-connection="'+tab+'">添加演示连接</button>');}
function action(a){switch(a){case 'answer':answer=scenes[scene].options[choice][0];history+=agent(receipt('已确认 · '+answer));transition('plan');break;case 'edit':edit();break;case 'savePlan':{const lines=$('planEditor').value.split('\n').map(s=>s.trim()).filter(Boolean);if(lines.length!==4){toast('请保留四个步骤，以便体验阶段更新');return}planCustom=lines;$('dialog').close();render();break}case 'start':history+=agent(receipt('执行计划已确认 · 4 个步骤'));start();break;case 'pause':clearInterval(timer);paused=true;render();break;case 'resume':paused=false;render();schedule();break;case 'allow':case 'deny':history+=agent(receipt(a==='allow'?'已允许 · 仅本次任务访问':'已跳过连接 · 使用已有资料继续'));start('blocked');break;case 'retry':history+=agent(receipt('你选择了重试 · 正在恢复当前步骤'));start('done');break;case 'skip':history+=agent(receipt('已跳过不可用资料 · 其余内容已保留'));transition('done');break;case 'preview':preview();break;case 'download':download();break;}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){choice=Number(c.dataset.choice);render();return}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action);if(e.target.closest('[data-close]'))$('dialog').close();const t=e.target.closest('[data-tab]');if(t)connections(t.dataset.tab);const save=e.target.closest('[data-save-connection]');if(save){const name=$('providerName').value.trim(),endpoint=$('endpoint').value.trim(),id=$('modelId').value.trim();let valid=false;try{valid=['https:','http:'].includes(new URL(endpoint).protocol)}catch{}if(!name||!id||!valid){toast('请填写连接名称、标识和有效的 HTTP 服务地址');return}if(save.dataset.saveConnection==='model'){profile={name,id,endpoint};const opt=document.createElement('option');opt.textContent=name+' / '+id;opt.selected=true;$('model').add(opt);$('modelTitle').textContent=name+' · 演示'}else toolProfiles.push(name);$('dialog').close();toast('演示配置已添加，未连接真实服务')}});
$('composer').addEventListener('submit',e=>{e.preventDefault();const text=$('input').value.trim();if(!text&&!files.length)return;$('input').value='';const display=text+(files.length?'\n附件：'+files.join('、'):'');history+=user(display);files=[];$('attachments').textContent='';if(stage==='ask'){answer=text||'结合附件确定方向';history+=agent(receipt('已记录你的回答'));transition('plan')}else if(stage==='done'){extraContext=text;history+=agent('<p>收到。这一轮会结合你的补充更新成果。原型将演示修改和再次交付的过程。</p>');start('done')}else{extraContext=text;history+=agent('<p>已把这条补充放入任务上下文。'+(stage==='approval'?'当前授权仍由你通过上方操作决定。':stage==='blocked'?'当前问题仍可选择重试或跳过。':'你可以继续使用当前步骤的操作推进任务。')+'</p>');render();$('chat').scrollTop=$('chat').scrollHeight}});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}});
$('scene').onchange=e=>{scene=e.target.value;reset()};$('restart').onclick=reset;$('newTask').onclick=()=>{reset();$('input').focus()};$('jump').onchange=e=>{const next=e.target.value;clearInterval(timer);history=initial();answer=next==='ask'?'':scenes[scene].options[0][0];if(next!=='ask')history+=agent(receipt('已确认方向 · '+answer));if(next==='running')start();else transition(next)};
$('closeDialog').onclick=()=>$('dialog').close();$('connectionsNav').onclick=()=>connections();$('connectFooter').onclick=()=>connections();$('modelSettings').onclick=()=>connections();$('model').onchange=e=>$('modelTitle').textContent=e.target.value+' · 演示';$('editPlan').onclick=edit;$('togglePlan').onclick=()=>$('app').classList.toggle('show-plan');$('conversationNav').onclick=()=>{$('app').classList.remove('show-plan');$('input').focus()};$('currentTask').onclick=()=>$('input').focus();$('artifactsNav').onclick=()=>stage==='done'?preview():modal('任务成果','<p class="muted">任务完成后，成果会出现在这里。你可以从顶部「查看状态」选择「成果交付」体验。</p>');$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{files=Array.from(e.target.files).map(f=>f.name);$('attachments').textContent='附件（仅展示文件名）：'+files.join(' · ');e.target.value=''};
reset();
})();
</script>
<script src="studio.js"></script>
</body>
</html>
