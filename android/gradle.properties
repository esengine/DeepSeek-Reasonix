# AndroidX is the only copy of the support libraries this project uses; the
# non-transitive R class keeps the app's own resources from aliasing library
# ones, which is what makes `R.string.*` unambiguous here.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The project lives under a path with Chinese characters, which AGP refuses on
# Windows by default for a reason that no longer applies here: the failure it
# warns about came from `aapt2` passing paths through a non-UTF-8 code page, and
# both the JDK (18+) and the NDK's tools now use UTF-8 throughout. The build is
# verified to produce a working APK under this path — `scripts/build.sh` is the
# check, and the packaged page is read from assets at runtime rather than by
# aapt. Setting this to true is the documented way to accept that trade.
android.overridePathCheck=true

# The daemon is what keeps a second `gradle assembleDebug` from re-reading the
# whole SDK, and the heap is sized for the R8 pass over the WebView and the
# packaged page rather than for this handful of Kotlin files.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
