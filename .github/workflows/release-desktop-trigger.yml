name: Relay desktop prerelease
run-name: Relay desktop prerelease ${{ github.ref_name }}

# Keep the production signing build on protected main-v2. The tag-triggered
# relay carries only the immutable candidate tag into the protected workflow.
on:
  push:
    tags: ["desktop-v*-*"]

permissions:
  actions: write
  contents: read

jobs:
  relay:
    name: dispatch protected desktop control plane
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-desktop.yml on main-v2
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CONTROL_PLANE_REF: ${{ github.event.repository.default_branch }}
        with:
          script: |
            if (process.env.CONTROL_PLANE_REF !== 'main-v2') {
              core.setFailed(`Unexpected default branch: ${process.env.CONTROL_PLANE_REF}`);
              return;
            }
            if (/^desktop-v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-preview\.(?:0|[1-9]\d*)$/.test(process.env.RELEASE_TAG)) {
              core.setFailed(`Desktop Preview must be dispatched without a Git tag: ${process.env.RELEASE_TAG}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-desktop.yml',
              ref: process.env.CONTROL_PLANE_REF,
              inputs: {
                channel: 'stable',
                tag: process.env.RELEASE_TAG,
              },
            });
