name: Deploy crash worker

on:
  workflow_dispatch:
    inputs:
      firebase_data_action:
        description: Firebase crash history operation (migration actions do not deploy the Worker)
        required: true
        default: none
        type: choice
        options:
          - none
          - dry-run
          - apply
          - verify-only
      confirmation:
        description: Enter APPLY_FIREBASE_CRASH_DATA when selecting apply
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-crash-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/platform' && inputs.firebase_data_action == 'none'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/crash-report/package-lock.json
      - name: Validate
        working-directory: workers/crash-report
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Apply and verify diagnostics v2 D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:diagnostics-v2
      - name: Apply and verify Firebase crash D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:firebase-crash
      - name: Apply dashboard performance indexes
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:dashboard-indexes
      - name: Apply telemetry queue receipts schema
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute reasonix-crash --remote --file=migrate-telemetry-queue.sql
      - name: Apply and verify feedback D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute reasonix-crash --remote --file=migrate-feedback.sql
          out=$(npx wrangler d1 execute reasonix-crash --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ('feedback','feedback_quota','feedback_status_created','feedback_install_created','feedback_status_version','feedback_quota_day')")
          for name in feedback feedback_quota feedback_status_created feedback_install_created feedback_status_version feedback_quota_day; do
            printf '%s' "$out" | grep -q "\"$name\"" || { echo "missing $name after migration"; exit 1; }
          done
      - name: Apply and verify feedback triage D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute reasonix-crash --remote --file=migrate-feedback-triage.sql
          names="feedback_releases feedback_releases_install feedback_replies feedback_blocks feedback_trust feedback_public_images feedback_config feedback_audit feedback_replies_receipt feedback_replies_unhandled feedback_blocks_expires feedback_public_images_receipt feedback_audit_at feedback_install_status_updated"
          list=$(for n in $names; do printf "'%s'," "$n"; done | sed 's/,$//')
          out=$(npx wrangler d1 execute reasonix-crash --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ($list)")
          for name in $names; do
            printf '%s' "$out" | grep -q "\"$name\"" || { echo "missing $name after migration"; exit 1; }
          done
          echo "Trusted installs (hash prefix only) for review:"
          npx wrangler d1 execute reasonix-crash --remote --json --command "SELECT substr(install_hash,1,8) AS prefix, created_at, expires_at FROM feedback_trust ORDER BY created_at LIMIT 200"
      - name: Apply and verify feedback adoption D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute reasonix-crash --remote --file=migrate-feedback-adoptions.sql
          names="feedback_adoptions feedback_adoptions_install feedback_adoptions_item feedback_level_state"
          list=$(for n in $names; do printf "'%s'," "$n"; done | sed 's/,$//')
          out=$(npx wrangler d1 execute reasonix-crash --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ($list)")
          for name in $names; do
            printf '%s' "$out" | grep -q "\"$name\"" || { echo "missing $name after migration"; exit 1; }
          done
      - name: Apply and verify feedback account link D1 migration
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute reasonix-crash --remote --file=migrate-feedback-account-links.sql
          names="feedback_account_links feedback_account_links_account"
          list=$(for n in $names; do printf "'%s'," "$n"; done | sed 's/,$//')
          out=$(npx wrangler d1 execute reasonix-crash --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ($list)")
          for name in $names; do
            printf '%s' "$out" | grep -q "\"$name\"" || { echo "missing $name after migration"; exit 1; }
          done
      - name: Apply Studio telemetry schema
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute reasonix-crash --remote --file=migrate-studio-telemetry.sql
      - name: Apply isolated telemetry database schema
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:telemetry-db
      - name: Apply registry performance indexes and install rollup
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:registry-indexes
      - name: Sync Firebase crash secrets
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          configured=0
          [ -n "$FIREBASE_DATABASE_URL" ] && configured=$((configured + 1))
          [ -n "$FIREBASE_CLIENT_EMAIL" ] && configured=$((configured + 1))
          [ -n "$FIREBASE_PRIVATE_KEY" ] && configured=$((configured + 1))
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 3 ]; then
            echo "Firebase crash secrets must be either all configured or all absent."
            exit 1
          fi
          node -e 'process.stdout.write(JSON.stringify({FIREBASE_DATABASE_URL:process.env.FIREBASE_DATABASE_URL||null,FIREBASE_CLIENT_EMAIL:process.env.FIREBASE_CLIENT_EMAIL||null,FIREBASE_PRIVATE_KEY:process.env.FIREBASE_PRIVATE_KEY||null}))' | npx wrangler secret bulk
      - name: Deploy
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy
      - name: Sync feedback secrets
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEEDBACK_TOKEN_SECRET: ${{ secrets.FEEDBACK_TOKEN_SECRET }}
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
          OPS_EMIT_TOKEN: ${{ secrets.OPS_EMIT_TOKEN }}
          FEEDBACK_ACCOUNT_SECRET: ${{ secrets.FEEDBACK_ACCOUNT_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({FEEDBACK_TOKEN_SECRET:process.env.FEEDBACK_TOKEN_SECRET||null,FEEDBACK_ADMIN_TOKEN:process.env.FEEDBACK_ADMIN_TOKEN||null,OPS_EMIT_TOKEN:process.env.OPS_EMIT_TOKEN||null,FEEDBACK_ACCOUNT_SECRET:process.env.FEEDBACK_ACCOUNT_SECRET||null}))' | npx wrangler secret bulk
      # Mirrors the ALERT_WEBHOOK repo secret into the worker so the ingest
      # sentinel can push alerts (see runIngestSentinel). Managed here so
      # nobody needs local Cloudflare credentials; when the repo secret is
      # unset the sentinel stays log-only.
      - name: Sync alert webhook secret
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "ALERT_WEBHOOK repo secret not set; removing any existing worker secret."
            printf '{"ALERT_WEBHOOK":null}' | npx wrangler secret bulk
            exit 0
          fi
          printf '%s' "$ALERT_WEBHOOK" | npx wrangler secret put ALERT_WEBHOOK

  migrate-firebase-data:
    if: github.event_name == 'workflow_dispatch' && inputs.firebase_data_action != 'none'
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the protected production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/platform" ]; then
            echo "Firebase crash data migration must run from platform."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/crash-report/package-lock.json
      - name: Validate
        working-directory: workers/crash-report
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Run Firebase crash history operation
        working-directory: workers/crash-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATA_ACTION: ${{ inputs.firebase_data_action }}
          FIREBASE_DATA_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          configured=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] && configured=$((configured + 1))
          [ -n "$FIREBASE_DATABASE_URL" ] && configured=$((configured + 1))
          [ -n "$FIREBASE_CLIENT_EMAIL" ] && configured=$((configured + 1))
          [ -n "$FIREBASE_PRIVATE_KEY" ] && configured=$((configured + 1))
          if [ "$configured" -ne 4 ]; then
            echo "Cloudflare and Firebase migration secrets must all be configured."
            exit 1
          fi

          case "$FIREBASE_DATA_ACTION" in
            dry-run)
              npm run migrate:firebase-data
              ;;
            apply)
              if [ "$FIREBASE_DATA_CONFIRMATION" != "APPLY_FIREBASE_CRASH_DATA" ]; then
                echo "Apply requires the exact confirmation APPLY_FIREBASE_CRASH_DATA."
                exit 1
              fi
              npm run migrate:firebase-data -- --apply
              npm run migrate:firebase-data -- --verify-only
              ;;
            verify-only)
              npm run migrate:firebase-data -- --verify-only
              ;;
            *)
              echo "Unsupported Firebase crash data action."
              exit 1
              ;;
          esac
