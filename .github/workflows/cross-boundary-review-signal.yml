name: Cross-boundary review signal

# This candidate-context workflow carries no write permission and executes no
# repository code. Its completion only asks the protected workflow_run policy
# to fetch current reviews and recompute the real status.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  signal:
    name: signal cross-boundary review reevaluation
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review state changed; protected policy will reevaluate the pull request."
