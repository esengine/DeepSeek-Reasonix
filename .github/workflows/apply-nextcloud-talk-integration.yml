name: Apply Nextcloud Talk integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextcloud-talk-bot
    paths:
      - scripts/apply_nextcloud_talk_integration.py
      - .github/workflows/apply-nextcloud-talk-integration.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/nextcloud-talk-bot
          fetch-depth: 0

      - name: Set up root Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Prepare deterministic source anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("desktop/frontend/src/App.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''    allowAll: bot.allowlist.allowAll,
              allowlistEnabled: bot.allowlist.enabled,
              allowlistUsers,'''
          # The compact source has two equivalent global allowlist blocks. Mark
          # the QQ one so the integration transform can target the generic
          # connection block unambiguously.
          if text.count(old) == 2:
              text = text.replace(old, old.replace("allowlistUsers,", "allowlistUsers, // nextcloud-transform-keep-qq"), 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply integration wiring
        run: |
          python3 -m py_compile scripts/apply_nextcloud_talk_integration.py
          python3 scripts/apply_nextcloud_talk_integration.py

      - name: Normalize generated focused tests and temporary anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "internal/botruntime/nextcloud_talk_test.go",
              "internal/config/nextcloud_talk_bot_test.go",
              "desktop/nextcloud_talk_bot_test.go",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(r"\t", "\t")
              path.write_text(text, encoding="utf-8")
          app = Path("desktop/frontend/src/App.tsx")
          text = app.read_text(encoding="utf-8").replace(" // nextcloud-transform-keep-qq", "")
          app.write_text(text, encoding="utf-8")
          PY

      - name: Format Go changes
        run: |
          gofmt -w \
            internal/config/config.go \
            internal/config/render.go \
            internal/config/nextcloud_talk_bot_test.go \
            internal/bot/nextcloudtalk/adapter.go \
            internal/bot/nextcloudtalk/adapter_test.go \
            internal/botruntime/runtime.go \
            internal/botruntime/nextcloud_talk_test.go \
            internal/cli/bot.go \
            desktop/bot_connection_app.go \
            desktop/nextcloud_talk_bot_test.go
          git diff --check

      - name: Run root Go tests
        run: go test ./...

      - name: Run desktop Go tests
        working-directory: desktop
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop frontend
        working-directory: desktop/frontend
        run: pnpm typecheck

      - name: Verify Nextcloud integration is present
        run: |
          grep -q 'PlatformNextcloudTalk' internal/botruntime/runtime.go
          grep -q 'nextcloud-talk' internal/cli/bot.go
          grep -q 'settings.botNextcloudTalk' desktop/frontend/src/components/SettingsPanel.tsx
          grep -q 'nextcloud-talk' desktop/frontend/src/App.tsx

      - name: Remove temporary integration helpers
        run: rm -f scripts/apply_nextcloud_talk_integration.py .github/workflows/apply-nextcloud-talk-integration.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(bot): finish Nextcloud Talk integration"
          git push origin feature/nextcloud-talk-bot
