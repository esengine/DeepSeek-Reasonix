name: Release desktop

# Desktop (Electron) release line. Official releases are called by
# release-stable.yml after its single GitHub environment approval. Production
# Certum signing therefore runs from the protected main-v2 control plane.
#
# The Electron shell cannot cross-compile its native targets from one host, so
# build/ fans out to one native runner per platform. Artifacts are
# minisign-signed (MINISIGN_* secrets), a latest.json manifest is generated, and
# everything is published to a GitHub release and mirrored to R2 (the updater
# reads R2 first, then the crash worker release gateway; stable desktop releases
# own GitHub's repository-wide "latest").
#
# Historical workflow-call inputs still understand Preview artifacts so old
# runs remain diagnosable. They are not exposed by manual dispatch and cannot
# create a new public Preview release.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Recovery channel"
        type: choice
        options: [stable]
        default: stable
      tag:
        description: "stable: tag to publish (e.g. desktop-v1.1.0)"
        required: false
        type: string
      production_signing_smoke:
        description: "Verify production signing and trust without publishing"
        required: false
        default: false
        type: boolean
      signing_preflight:
        description: "Auto-approve through CI, verify the full signing path, attest it, and do not publish"
        required: false
        default: false
        type: boolean
  workflow_call:
    outputs:
      artifact_prefix:
        description: "Signed artifacts produced by this candidate invocation"
        value: ${{ jobs.resolve.outputs.artifact_prefix }}
      signing_fingerprint:
        description: "Validated Certum and packaging policy fingerprint"
        value: ${{ jobs.signing-contract.outputs.fingerprint }}
    inputs:
      channel:
        description: "Release channel selected by the approved orchestrator"
        required: true
        type: string
      tag:
        description: "Existing desktop tag to publish"
        required: false
        default: ""
        type: string
      base_version:
        description: "Base version used for preview builds"
        required: false
        default: ""
        type: string
      approved_cli_tag:
        description: "Stable CLI tag recorded by the approved orchestrator"
        required: true
        type: string
      approved_sha:
        description: "Immutable commit recorded by the approved orchestrator"
        required: true
        type: string
      orchestrated:
        description: "True only when called by an approved release orchestrator"
        required: false
        default: false
        type: boolean
      orchestrator:
        description: "Trusted release orchestrator (legacy Preview calls remain readable)"
        required: false
        default: stable
        type: string
      preview_number:
        description: "Legacy Preview ordinal for old workflow-call compatibility"
        required: false
        default: ""
        type: string
      signing_preflight:
        description: "Verify both Windows signing stages without publishing"
        required: false
        default: false
        type: boolean
      candidate_preparation:
        description: "Build, sign, and accept an untagged Stable candidate without publishing"
        required: false
        default: false
        type: boolean
      candidate_rehearsal:
        description: "Isolated non-publishing candidate rehearsal"
        required: false
        default: false
        type: boolean
      signing_preflight_verified:
        description: "The approved stable caller completed signing_preflight in this run"
        required: false
        default: false
        type: boolean
      preflight_artifact_prefix:
        description: "Signed artifact set returned by a verified candidate preparation"
        required: false
        default: ""
        type: string
      candidate_id:
        description: "Sealed release candidate identity"
        required: false
        default: ""
        type: string
      candidate_source_run_id:
        description: "Trusted candidate producer run"
        required: false
        default: ""
        type: string
      candidate_source_run_attempt:
        description: "Trusted candidate producer attempt"
        required: false
        default: ""
        type: string
      candidate_control_sha:
        description: "Control-plane SHA that built the sealed candidate"
        required: false
        default: ""
        type: string
      candidate_signing_fingerprint:
        description: "Signing policy fingerprint sealed with the candidate"
        required: false
        default: ""
        type: string
      candidate_verified:
        description: "Protected Stable preflight verified candidate provenance and bytes"
        required: false
        default: false
        type: boolean
      desktop_manual_only:
        description: "Approved manual Desktop distribution: unsigned Windows, no update pointer move"
        required: false
        default: false
        type: boolean
      reuse_manual_artifacts:
        description: "Reuse the exact verified v1.38.8 manual producer run (v1.38.8 only)"
        required: false
        default: false
        type: boolean

concurrency:
  # A channel pointer is a monotonic public state machine. Serialize every
  # publisher for the same normalized channel, including the legacy canary alias.
  group: release-desktop-${{ (inputs.channel == 'preview' || inputs.channel == 'canary') && 'preview' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload artifacts

jobs:
  resolve:
    name: resolve Desktop release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      notes_version: ${{ steps.release.outputs.notes_version }}
      sha: ${{ steps.candidate.outputs.sha }}
      artifact_prefix: ${{ inputs.reuse_manual_artifacts && 'desktop-34816299501-1-preflight' || format('desktop-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.signing_preflight && 'preflight' || 'release') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version and channel
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_ORCHESTRATED: ${{ inputs.orchestrated }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_TAG: ${{ inputs.tag }}
          IN_BASE_VERSION: ${{ inputs.base_version }}
          IN_PRODUCTION_SIGNING_SMOKE: ${{ inputs.production_signing_smoke }}
          IN_SIGNING_PREFLIGHT: ${{ inputs.signing_preflight }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          IN_PREVIEW_NUMBER: ${{ inputs.preview_number }}
        run: bash scripts/resolve-desktop-release.sh

      - name: Resolve immutable candidate
        id: candidate
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IN_ORCHESTRATED: ${{ inputs.orchestrated }}
          IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_PREPARATION: ${{ inputs.candidate_preparation }}
          CANDIDATE_REHEARSAL: ${{ inputs.candidate_rehearsal }}
        run: bash scripts/resolve-desktop-candidate.sh

  orchestration-guard:
    name: verify approved orchestrator
    needs: resolve
    if: ${{ inputs.orchestrated }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify caller and approved release ref
        env:
          ACTUAL_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ format('{0}/.github/workflows/release-{1}.yml@{2}', github.repository, inputs.orchestrator, github.ref) }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          APPROVED_CLI_TAG: ${{ inputs.approved_cli_tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_CHANNEL: ${{ (inputs.orchestrator == 'candidate' || inputs.orchestrator == 'promote') && 'stable' || inputs.orchestrator }}
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
          VERIFY_RELEASE_CHECKOUT: false
        run: |
          bash scripts/verify-release-authorization.sh
          if [ "${{ inputs.candidate_preparation }}" != "true" ]; then
            bash scripts/verify-release-tag.sh
          fi

  release-gate:
    name: approve standalone desktop release
    needs: resolve
    if: ${{ !inputs.orchestrated }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Standalone Preview is limited to non-publishing signing checks, but still
    # exercises the production policy behind the protected `canary` environment.
    environment: ${{ needs.resolve.outputs.channel == 'preview' && 'canary' || 'release' }}
    steps:
      - env:
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "Approved standalone desktop $RELEASE_CHANNEL release $RELEASE_TAG"

  signing-contract:
    name: validate Windows release signing contract
    needs: [resolve, orchestration-guard, release-gate]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && ((inputs.orchestrated && needs.orchestration-guard.result == 'success') || (!inputs.orchestrated && needs.release-gate.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      fingerprint: ${{ steps.contract.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Validate the protected control-plane files that GitHub and SignPath
          # execute, including during recovery of an older candidate.
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate signing mode
        env:
          PREFLIGHT_ARTIFACT_PREFIX: ${{ inputs.preflight_artifact_prefix }}
        run: |
          if [ "${{ inputs.reuse_manual_artifacts }}" = "true" ] && [ "${{ inputs.desktop_manual_only }}" != "true" ]; then
            echo "::error::artifact recovery requires the scoped manual Desktop exception"
            exit 1
          fi
          if [ "${{ inputs.desktop_manual_only }}" = "true" ]; then
            if [ "${{ inputs.orchestrated }}" != "true" ] || [ "${{ inputs.channel }}" != "stable" ]; then
              echo "::error::manual Desktop exception requires the approved stable orchestrator"
              exit 1
            fi
            if ! bash scripts/manual-desktop-exception.sh validate \
              "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.sha }}"; then
              echo "::error::manual Desktop exception is restricted to approved candidates"
              exit 1
            fi
          fi
          if [ "${{ inputs.production_signing_smoke }}" = "true" ] && [ "${{ inputs.signing_preflight }}" = "true" ]; then
            echo "::error::production_signing_smoke and signing_preflight are mutually exclusive"
            exit 1
          fi
          if [ "${{ inputs.candidate_preparation }}" = "true" ] && { [ "${{ inputs.signing_preflight }}" != "true" ] || [ "${{ inputs.orchestrator }}" != "candidate" ]; }; then
            echo "::error::candidate preparation must use the protected candidate orchestrator and signing preflight"
            exit 1
          fi
          if [ "${{ inputs.signing_preflight_verified }}" = "true" ] && [ "${{ inputs.orchestrated }}" != "true" ]; then
            echo "::error::only the approved stable orchestrator can assert signing_preflight_verified"
            exit 1
          fi
          if [ -n "$PREFLIGHT_ARTIFACT_PREFIX" ]; then
            if [ "${{ inputs.orchestrated }}" != "true" ] || [ "${{ inputs.signing_preflight_verified }}" != "true" ] || [ "${{ inputs.signing_preflight }}" = "true" ] || [ "${{ inputs.channel }}" != "stable" ]; then
              echo "::error::artifact reuse requires a verified stable orchestrator preflight"
              exit 1
            fi
            if [ "${{ inputs.reuse_manual_artifacts }}" = "true" ]; then
              test "$PREFLIGHT_ARTIFACT_PREFIX" = desktop-34816299501-1-preflight
            elif [ "${{ inputs.candidate_verified }}" = "true" ]; then
              [[ "${{ inputs.candidate_id }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}-[0-9a-f]{12}$ ]] || exit 1
              [[ "${{ inputs.candidate_source_run_id }}" =~ ^[1-9][0-9]*$ ]] || exit 1
              [[ "${{ inputs.candidate_source_run_attempt }}" =~ ^[1-9][0-9]*$ ]] || exit 1
              [[ "${{ inputs.candidate_control_sha }}" =~ ^[0-9a-f]{40}$ ]] || exit 1
              test -n "${{ inputs.candidate_signing_fingerprint }}"
              bash scripts/check-candidate-desktop-prefix.sh "$PREFLIGHT_ARTIFACT_PREFIX" \
                "${{ inputs.candidate_source_run_id }}" "${{ inputs.candidate_source_run_attempt }}"
            else
              [[ "$PREFLIGHT_ARTIFACT_PREFIX" =~ ^desktop-${GITHUB_RUN_ID}-[1-9][0-9]*-preflight$ ]] || exit 1
            fi
          fi

      - name: Validate and fingerprint SignPath contract
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/signpath-contract validate
          fingerprint="$(go run ./cmd/signpath-contract fingerprint)"
          if [ "${{ inputs.candidate_verified }}" = "true" ] && [ "$fingerprint" != "${{ inputs.candidate_signing_fingerprint }}" ]; then
            echo "::error::sealed candidate signing policy no longer matches the protected publisher"
            exit 1
          fi
          if [ "${{ inputs.reuse_manual_artifacts }}" = "true" ]; then
            node scripts/verify-manual-desktop-producer.mjs
            fingerprint=v1:48c45e7bb52e5a9d0883b917c36e8cb0f4e7d34b6703ff44019d8ef5d52ebf21
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Require current standalone signing attestation
        if: ${{ github.repository == 'esengine/DeepSeek-Reasonix' && !inputs.signing_preflight && !inputs.production_signing_smoke && !(inputs.orchestrated && inputs.signing_preflight_verified) }}
        env:
          ACTUAL: ${{ vars.SIGNPATH_RELEASE_SIGNING_ATTESTATION }}
          EXPECTED: ${{ steps.contract.outputs.fingerprint }}
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SIGNPATH_RELEASE_SIGNING_ATTESTATION does not match the current protected signing contract"
            echo "::error::Run release-desktop.yml with signing_preflight=true before publishing"
            echo "expected=$EXPECTED"
            exit 1
          fi

  build:
    name: build non-Windows (${{ matrix.name }}, ${{ inputs.signing_preflight && 'preflight' || 'release' }})
    needs: [resolve, signing-contract]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' && inputs.preflight_artifact_prefix == '' && !inputs.reuse_manual_artifacts }}
    permissions:
      contents: read # checkout only; the publish job holds contents: write
      actions: read # SignPath reads run details + downloads the unsigned artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep preflight on the same complete native matrix as publication so
          # it cannot attest a release whose adjacent platform build is broken.
          - { runner: macos-15, platform: darwin/arm64, name: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin/amd64, name: darwin-amd64 }
          - { runner: macos-15, platform: darwin/universal, name: darwin-universal }
          - { runner: ubuntu-22.04, platform: linux/amd64, name: linux-amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash # desktop-build.sh is bash; windows runners default to pwsh otherwise
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # nfpm builds the .deb in desktop-build.sh's linux branch; go install
      # drops it in ~/go/bin, already on PATH.
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # macOS: create-dmg packages the .app into a drag-to-Applications .dmg.
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # macOS signing: import the Developer ID cert into a throwaway keychain and
      # stage the notarization key. No-ops (and the build ad-hoc signs) when the
      # APPLE_* secrets aren't set, so forks still build.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 unset — desktop build will ad-hoc sign (un-notarized)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend the signing keychain to the search list so codesign / find-identity see it.
          existing_keychains=()
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" "${existing_keychains[@]}"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and package
        env:
          # macOS Developer ID + notarization path turns on only when all five
          # APPLE_* secrets are present; otherwise desktop-build.sh ad-hoc signs.
          # Harmless on Windows/Linux runners (only the darwin branch reads these).
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_NOTARIZATION_LOG_DIR: ${{ runner.temp }}/apple-notarization
        run: scripts/desktop-build.sh "${{ matrix.platform }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"

      - name: Upload Apple notarization diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-notarization-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ runner.temp }}/apple-notarization/*.json
          if-no-files-found: ignore
          retention-days: 7

      # Candidate code is immutable, but release validation belongs to the
      # protected workflow control plane. Reuse this sparse checkout later for
      # Authenticode verification rather than trusting a candidate-owned test.
      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false

      # Exercise the exact production Electron package built for Stable: launch
      # the packaged shell and require the shell -> Go service handshake before
      # signing or publication.
      - name: Smoke-test native macOS archive startup
        if: runner.os == 'macOS' && matrix.name != 'darwin-universal'
        run: |
          ditto -xk "dist/Reasonix-${{ matrix.name }}.zip" "$RUNNER_TEMP/desktop-startup"
          node desktop/packaging/verify.mjs "$RUNNER_TEMP/desktop-startup/Reasonix.app" --kind darwin-app-dir
          node desktop/packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Reasonix.app"

      - name: Smoke-test Universal macOS candidate on Apple Silicon
        if: runner.os == 'macOS' && matrix.name == 'darwin-universal'
        run: |
          node desktop/packaging/verify.mjs desktop/build/candidate/darwin-universal/Reasonix.app --kind darwin-app-dir
          node desktop/packaging/smoke.mjs desktop/build/candidate/darwin-universal/Reasonix.app

      - name: Smoke-test packaged Linux startup
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node desktop/packaging/smoke.mjs \
            desktop/build/bin/app --service desktop/build/bin/reasonix-desktop

      # Same tree, no handed-over service path: a shell started directly (pinned
      # taskbar icon, double-click) must find reasonix-desktop beside app/.
      - name: Smoke-test packaged Linux startup without a configured service
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node desktop/packaging/smoke.mjs desktop/build/bin/app

      - name: Upload package size report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: desktop/build/reports/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop source maps
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-sourcemaps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: |
            desktop/build/sourcemaps/${{ matrix.name }}
            desktop/frontend/sourcemaps
          if-no-files-found: error
          retention-days: 90

      - name: Sign artifacts (minisign)
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: go run ./cmd/sign sign ../dist/*

      - name: Bind signed artifacts to candidate and workflow
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ inputs.candidate_control_sha || github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        run: node release-control/scripts/desktop-release-artifacts.mjs pack dist "$RUNNER_TEMP/desktop-bundle" "${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop-bundle
          # A failed-job retry replaces only this fully revalidated platform.
          # The resolved invocation prefix remains stable across that retry.
          overwrite: true
          if-no-files-found: error
          # Same-run handoff to the publish job only; 7 days covers debugging.
          retention-days: 7

  windows-build:
    name: build Windows candidate (${{ matrix.arch }})
    needs: [resolve, signing-contract]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' && inputs.preflight_artifact_prefix == '' && !inputs.reuse_manual_artifacts }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: windows/amd64, name: windows-amd64, arch: amd64 }
          - { runner: windows-11-arm, platform: windows/arm64, name: windows-arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      HAS_CERTUM: ${{ secrets.CERTUM_USERNAME != '' && secrets.CERTUM_OTP_URI != '' && secrets.CERTUM_KEY_ID != '' && !inputs.desktop_manual_only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install NSIS
        run: pwsh -NoProfile -File scripts/install-nsis.ps1
      - name: Require Windows Authenticode signing
        if: github.repository == 'esengine/DeepSeek-Reasonix' && !inputs.desktop_manual_only
        run: |
          if [ "$HAS_CERTUM" != "true" ]; then
            echo "::error::Certum credentials are required for public Windows releases"
            exit 1
          fi
      - name: Build and package
        run: scripts/desktop-build.sh "${{ matrix.platform }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"
      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - name: Smoke-test packaged Electron startup
        run: |
          node desktop/packaging/smoke.mjs \
            desktop/build/electron/${{ matrix.name }}/app \
            --service desktop/build/bin/reasonix-desktop.exe
      - name: Archive Windows signing inputs
        if: env.HAS_CERTUM == 'true'
        run: |
          signing_archive="$(cygpath -u "$RUNNER_TEMP")/windows-signing-inputs.tar"
          tar -cf "$signing_archive" desktop/build/windows/signing-payload desktop/build/windows/installer/reasonix_project.nsh
      - name: Upload Windows signing inputs
        if: env.HAS_CERTUM == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-${{ matrix.name }}
          path: ${{ runner.temp }}/windows-signing-inputs.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Finalize manual Windows package
        if: inputs.desktop_manual_only
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          REASONIX_REQUIRE_PAYLOAD_MANIFEST: "1"
        run: |
          (
            cd desktop
            go run ./cmd/sign windows-payload build/windows/signing-payload "${{ needs.resolve.outputs.version }}"
            go run ./cmd/sign sign build/windows/signing-payload/reasonix-payload.json
            go run ./cmd/sign verify build/windows/signing-payload/reasonix-payload.json
          )
          scripts/package-windows-desktop.sh "${{ matrix.arch }}" desktop/build/windows/signing-payload
      - name: Install and smoke-test final manual Windows installer
        if: inputs.desktop_manual_only
        shell: pwsh
        run: >-
          ./release-control/scripts/test-windows-installer-startup.ps1
          -InstallerPath "dist/Reasonix-windows-${{ matrix.arch }}-installer.exe"
          -ExpectedVersion "${{ needs.resolve.outputs.version }}"
          -EvidenceDirectory "$env:RUNNER_TEMP/reasonix-installer-acceptance"
      - name: Sign manual artifacts (minisign)
        if: inputs.desktop_manual_only
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: go run ./cmd/sign sign ../dist/*
      - name: Bind manual artifacts to candidate and workflow
        if: inputs.desktop_manual_only
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        run: node release-control/scripts/desktop-release-artifacts.mjs pack dist "$RUNNER_TEMP/desktop-bundle" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        if: inputs.desktop_manual_only
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop-bundle
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload package size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: desktop/build/reports/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop source maps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-sourcemaps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: |
            desktop/build/sourcemaps/${{ matrix.name }}
            desktop/frontend/sourcemaps
          if-no-files-found: error
          retention-days: 30

  windows-sign:
    name: sign Windows candidate
    needs: [resolve, windows-build, signing-contract]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.windows-build.result == 'success' && needs.signing-contract.result == 'success' && github.repository == 'esengine/DeepSeek-Reasonix' && !inputs.desktop_manual_only }}
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    # Both architectures use one proven x64 virtual-card session. Native build
    # and final startup acceptance still run on their original architectures.
    concurrency:
      group: certum-signing
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Reuse completed signed architectures from an earlier attempt
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
          RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
          mkdir -p "$runner_temp/completed"
          missing=()
          for arch in amd64 arm64; do
            name="${{ needs.resolve.outputs.artifact_prefix }}-windows-$arch"
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq ".artifacts | map(select(.name == \"$name\" and .expired == false)) | sort_by(.id) | last | .id // empty")"
            if [ -z "$artifact_id" ]; then
              echo "$arch=false" >> "$GITHUB_OUTPUT"
              missing+=("$arch")
              continue
            fi
            mkdir -p "$runner_temp/completed/$arch"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$runner_temp/completed/$arch.zip"
            unzip -q "$runner_temp/completed/$arch.zip" -d "$runner_temp/completed/$arch"
            node release-control/scripts/desktop-release-artifacts.mjs verify \
              "$runner_temp/completed/$arch" "windows-$arch"
            echo "$arch=true" >> "$GITHUB_OUTPUT"
            echo "Reusing signed Windows $arch bundle from artifact $artifact_id." >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "needs_signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            printf 'Architectures requiring signing: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8
        if: steps.reuse.outputs.needs_signing == 'true'
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-windows-amd64
          path: ${{ runner.temp }}/signing-inputs/amd64
      - uses: actions/download-artifact@v8
        if: steps.reuse.outputs.needs_signing == 'true'
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-windows-arm64
          path: ${{ runner.temp }}/signing-inputs/arm64
      - name: Restore both native-tested Windows payloads
        if: steps.reuse.outputs.needs_signing == 'true'
        env:
          RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
          for arch in amd64 arm64; do
            [ ! -d "$runner_temp/completed/$arch" ] || continue
            mkdir -p "$runner_temp/signing-work/$arch"
            tar -xf "$runner_temp/signing-inputs/$arch/windows-signing-inputs.tar" -C "$runner_temp/signing-work/$arch"
            cp -R "$runner_temp/signing-work/$arch/desktop/build/windows/signing-payload" "signed-payload-$arch"
            node desktop/packaging/signing-files.mjs "signed-payload-$arch" --check
          done
      - name: Install NSIS
        if: steps.reuse.outputs.needs_signing == 'true'
        shell: pwsh
        run: ./release-control/scripts/install-nsis.ps1
      - name: Connect to Certum
        if: steps.reuse.outputs.needs_signing == 'true'
        uses: ./release-control/.github/actions/setup-certum
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}
      - name: Finalize amd64 in the shared Certum session
        if: steps.reuse.outputs.amd64 != 'true'
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
          RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
          bash release-control/scripts/finalize-windows-signed-candidate.sh amd64 \
            "$runner_temp/signing-work/amd64" signed-payload-amd64 dist-amd64 \
            "$runner_temp/desktop-bundle-amd64" "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.amd64 != 'true'
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-amd64
          path: ${{ runner.temp }}/desktop-bundle-amd64
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Finalize arm64 in the shared Certum session
        if: steps.reuse.outputs.arm64 != 'true'
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
          RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
          bash release-control/scripts/finalize-windows-signed-candidate.sh arm64 \
            "$runner_temp/signing-work/arm64" signed-payload-arm64 dist-arm64 \
            "$runner_temp/desktop-bundle-arm64" "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.arm64 != 'true'
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-arm64
          path: ${{ runner.temp }}/desktop-bundle-arm64
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed package size reports
        if: steps.reuse.outputs.needs_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-windows-signed
          path: desktop/build/reports/windows-*
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  windows-runtime-acceptance:
    name: verify signed Windows installer (${{ matrix.arch }})
    needs: [resolve, windows-sign]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.windows-sign.result == 'success' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: amd64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-bundle
      - name: Install and smoke-test exact signed installer
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/windows-bundle/files" -Filter '*installer.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one signed installer, found $($installer.Count)" }
          ./release-control/scripts/test-windows-installer-startup.ps1 `
            -InstallerPath $installer[0].FullName `
            -ExpectedVersion "${{ needs.resolve.outputs.version }}" `
            -EvidenceDirectory "$env:RUNNER_TEMP/reasonix-installer-acceptance"
      - name: Upload signed Windows installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-signed
          path: |
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.json
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.png
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.log
            !${{ runner.temp }}/reasonix-installer-acceptance/installed/**
            !${{ runner.temp }}/reasonix-installer-acceptance/**/cache/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Record signed Windows acceptance receipt
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/windows-bundle/files"
          $installer = @(Get-ChildItem -LiteralPath $bundle -Filter '*installer.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one signed installer, found $($installer.Count)" }
          @{ schema = 1; kind = "windows-${{ matrix.arch }}"; status = 'passed'; version = "${{ needs.resolve.outputs.version }}"; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/windows-${{ matrix.arch }}.json" -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-receipt-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-${{ matrix.arch }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  mac-universal-intel:
    name: verify Universal candidate on Intel
    needs: [resolve, build, signing-contract]
    if: ${{ always() && !cancelled() && needs.signing-contract.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_manual_artifacts)) && inputs.preflight_artifact_prefix == '' }}
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Install packaged smoke dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm --dir desktop install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-darwin-universal
          path: ${{ runner.temp }}/universal-bundle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_manual_artifacts && '34816299501' || github.run_id }}
      - name: Mount and smoke-test the exact Universal DMG
        run: |
          mount_dir="$RUNNER_TEMP/reasonix-universal"
          app_dir="$RUNNER_TEMP/reasonix-universal-app/Reasonix.app"
          mkdir -p "$mount_dir" "$(dirname "$app_dir")"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$RUNNER_TEMP/universal-bundle/files/Reasonix-darwin-universal.dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          ditto "$mount_dir/Reasonix.app" "$app_dir"
          codesign --verify --deep --strict "$app_dir"
          node desktop/packaging/verify.mjs "$app_dir" --kind darwin-app-dir
          node desktop/packaging/smoke.mjs "$app_dir"
      - name: Record Intel macOS acceptance receipt
        run: |
          jq -n --arg version "${{ needs.resolve.outputs.version }}" \
            --arg sha256 "$(shasum -a 256 "$RUNNER_TEMP/universal-bundle/files/Reasonix-darwin-universal.dmg" | awk '{print $1}')" \
            '{schema: 1, kind: "macos-universal-intel", status: "passed", version: $version, sha256: $sha256}' \
            > "$RUNNER_TEMP/macos-universal-intel.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-receipt-macos-universal-intel
          path: ${{ runner.temp }}/macos-universal-intel.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish release
    needs: [resolve, signing-contract, build, windows-build, windows-sign, windows-runtime-acceptance, mac-universal-intel]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.preflight_artifact_prefix != '' && inputs.orchestrated && inputs.signing_preflight_verified)) && (needs.windows-build.result == 'success' || (needs.windows-build.result == 'skipped' && inputs.preflight_artifact_prefix != '' && inputs.orchestrated && inputs.signing_preflight_verified)) && ((inputs.preflight_artifact_prefix == '' && needs.mac-universal-intel.result == 'success') || (inputs.preflight_artifact_prefix != '' && needs.mac-universal-intel.result == 'skipped')) && needs.signing-contract.result == 'success' && (needs.windows-sign.result == 'success' || (needs.windows-sign.result == 'skipped' && (inputs.desktop_manual_only || inputs.preflight_artifact_prefix != ''))) && (needs.windows-sign.result != 'success' || needs.windows-runtime-acceptance.result == 'success') && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Approved orchestrators have already passed the matching GitHub environment.
    # Direct prereleases and manual Stable recovery pass release-gate above. The
    # Certum signing completes before either platform bundle reaches publication.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      # A standalone recovery may build an older Stable tag. Keep the release
      # control plane on the protected workflow commit so newly-added
      # authorization and recovery scripts remain available, while the source
      # tree above stays pinned to the immutable candidate.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: release-control
          ref: ${{ github.workflow_sha }}

      - name: Revalidate immutable Desktop candidate
        env:
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          IN_ORCHESTRATED: ${{ inputs.orchestrated }}
          IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REQUIRE_CURRENT_MAIN: false
          VERIFY_RELEASE_CHECKOUT: true
        run: bash release-control/scripts/resolve-desktop-candidate.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/desktop-bundles
          pattern: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-{darwin-arm64,darwin-amd64,darwin-universal,windows-amd64,windows-arm64,linux-amd64}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_manual_artifacts && '34816299501' || github.run_id }}

      - name: Verify complete signed artifact handoff
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CONTROL_SHA: ${{ inputs.reuse_manual_artifacts && '09cdab3866d77c6ff0d007ee61b6aca3128ebe54' || inputs.candidate_control_sha || github.workflow_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
          RELEASE_ARTIFACT_PREFIX: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}
          RELEASE_PRODUCER_RUN_ID: ${{ inputs.candidate_source_run_id || github.run_id }}
          RELEASE_PRODUCER_RUN_ATTEMPT: ${{ inputs.candidate_source_run_attempt || github.run_attempt }}
        run: |
          if [ "${{ inputs.reuse_manual_artifacts }}" = "true" ]; then
            GITHUB_RUN_ID=34816299501 GITHUB_RUN_ATTEMPT=1 node release-control/scripts/desktop-release-artifacts.mjs collect "$RUNNER_TEMP/desktop-bundles" dist
          else
            node release-control/scripts/desktop-release-artifacts.mjs collect "$RUNNER_TEMP/desktop-bundles" dist
          fi

      # Generate latest.json with GitHub release download URLs; the mirror step
      # rewrites them to R2 afterwards. GITHUB_REPOSITORY is provided by the runner.
      - name: Generate manifest
        working-directory: desktop
        run: >-
          go run ./cmd/sign manifest ../dist
          "${{ needs.resolve.outputs.version }}"
          "${{ needs.resolve.outputs.tag }}"
          "${{ needs.resolve.outputs.notes_version }}"

      - name: Validate generated manifest before publication
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NOTES_VERSION: ${{ needs.resolve.outputs.notes_version }}
        run: |
          set -euo pipefail
          validation_channel="$CHANNEL"
          if [ "$CHANNEL" != "preview" ] && [ "$PRERELEASE" = "true" ]; then
            validation_channel="any"
          fi
          bash release-control/scripts/validate-desktop-release-manifest.sh \
            "$validation_channel" "$VERSION" \
            "https://github.com/esengine/DeepSeek-Reasonix/releases/download/${TAG}/" \
            dist/latest.json "$NOTES_VERSION"

      - name: Download orchestrator-reviewed release notes
        if: ${{ inputs.orchestrated && needs.resolve.outputs.channel != 'preview' }}
        uses: actions/download-artifact@v8
        with:
          name: orchestrator-reviewed-release-notes
          path: /tmp/orchestrator-reviewed-release-notes

      - name: Use orchestrator-reviewed release notes
        if: ${{ inputs.orchestrated && needs.resolve.outputs.channel != 'preview' }}
        run: |
          test -s /tmp/orchestrator-reviewed-release-notes/release-notes.md
          cp /tmp/orchestrator-reviewed-release-notes/release-notes.md /tmp/release-notes.md

      # Preview never appears on the GitHub releases page; the mirror job picks up
      # the signed dist via the preview-dist artifact below. Stable publishes a
      # GitHub release as usual.
      - name: Render reviewed release notes
        if: ${{ !inputs.orchestrated && needs.resolve.outputs.channel != 'preview' }}
        run: node scripts/release-notes.mjs render --version "${{ needs.resolve.outputs.notes_version }}" --output /tmp/release-notes.md

      - name: Revalidate approved release ref
        if: ${{ inputs.orchestrated }}
        env:
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/verify-release-tag.sh

      # Name the release being published instead of a fixed version, so the
      # disclosure cannot outlive or misdescribe the exception it belongs to.
      - name: Disclose manual Desktop distribution
        if: ${{ inputs.desktop_manual_only }}
        env:
          MANUAL_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cat >> /tmp/release-notes.md <<NOTES

          ## Manual desktop downloads / 桌面版手动下载

          This v${MANUAL_VERSION} desktop release is manual-download only on every platform. Windows packages do not carry Reasonix Authenticode signatures because SignPath signing is unavailable; Windows may show an unknown-publisher warning. Detached minisign signatures and SHA-256 checksums remain available. Desktop automatic-update channels are unchanged by this release and keep serving their previous version. CLI and npm distribution are unaffected.

          本次 v${MANUAL_VERSION} 桌面版所有平台均需手动下载安装。因 SignPath 签名服务暂不可用，Windows 包不含 Reasonix Authenticode 签名，系统可能显示未知发布者提示；仍提供 minisign 签名和 SHA-256 校验。本次发布不改变桌面自动更新通道，其仍指向此前版本；CLI 和 npm 正常发布。
          NOTES

      - name: Publish GitHub release
        if: needs.resolve.outputs.channel != 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_MANUAL_ONLY: ${{ inputs.desktop_manual_only || false }}
        # Keep the repository homepage focused on the installable desktop app;
        # the CLI release line is configured not to claim repository-wide latest.
        run: >-
          bash release-control/scripts/publish-desktop-github-release.sh
          "${{ needs.resolve.outputs.tag }}"
          "${{ needs.resolve.outputs.version }}"
          "${{ needs.resolve.outputs.prerelease }}"
          /tmp/release-notes.md
          dist

      - name: Upload preview dist for mirror
        if: needs.resolve.outputs.channel == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist/*
          if-no-files-found: error
          # Same-run handoff to the mirror step only; 7 days covers debugging.
          retention-days: 7

  attest-signing-contract:
    name: record standalone Windows signing attestation
    needs: [signing-contract, build, windows-build, windows-sign, windows-runtime-acceptance]
    if: ${{ always() && !cancelled() && inputs.signing_preflight && !inputs.orchestrated && github.repository == 'esengine/DeepSeek-Reasonix' && needs.signing-contract.result == 'success' && needs.build.result == 'success' && needs.windows-build.result == 'success' && needs.windows-sign.result == 'success' && needs.windows-runtime-acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VARIABLE_NAME: SIGNPATH_RELEASE_SIGNING_ATTESTATION
      VARIABLE_VALUE: ${{ needs.signing-contract.outputs.fingerprint }}
    steps:
      - name: Record verified signing contract
        run: |
          mkdir -p signing-attestation
          jq -n --arg fingerprint "$VARIABLE_VALUE" --arg workflow_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{fingerprint: $fingerprint, workflow_sha: $workflow_sha, run_id: $run_id, run_attempt: $run_attempt}' \
            > signing-attestation/verified-contract.json
          {
            echo "Both Windows signing jobs verified this contract: $VARIABLE_VALUE"
            echo 'For standalone recovery, a maintainer must promote this verified fingerprint:'
            echo '```sh'
            echo "gh variable set $VARIABLE_NAME --repo $GITHUB_REPOSITORY --body '$VARIABLE_VALUE'"
            echo '```'
            echo 'GITHUB_TOKEN cannot write repository variables. Orchestrated releases use same-run preflight evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-signing-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-attestation/verified-contract.json
          if-no-files-found: error
          retention-days: 90

  mirror:
    name: mirror to R2
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release download + compatibility manifest upload
      actions: write # dispatch pages.yml to re-bake the site version
    # Stable keeps GitHub as a fallback when R2 is unavailable. Preview has no
    # GitHub release, so it must fail closed before attempting publication.
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.publish.result == 'success' && github.repository_owner == 'esengine' }}
    env:
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: release-control
          ref: ${{ github.workflow_sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: release-control/desktop/go.mod
          cache: true
          cache-dependency-path: release-control/desktop/go.sum

      - name: Revalidate immutable Desktop candidate
        env:
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          IN_ORCHESTRATED: ${{ inputs.orchestrated }}
          IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REQUIRE_CURRENT_MAIN: false
          VERIFY_RELEASE_CHECKOUT: true
        run: bash release-control/scripts/resolve-desktop-candidate.sh

      - name: Require R2 for Preview
        if: needs.resolve.outputs.channel == 'preview' && env.HAS_R2 != 'true'
        run: |
          echo "::error::R2 credentials are required because Preview has no GitHub release fallback"
          exit 1

      - name: Revalidate approved release ref
        if: ${{ inputs.orchestrated }}
        env:
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/verify-release-tag.sh

      # Preview has no GitHub release — pull the signed dist from the workflow
      # artifact. Stable pulls from the published release.
      - name: Download preview dist
        if: env.HAS_R2 == 'true' && needs.resolve.outputs.channel == 'preview'
        uses: actions/download-artifact@v8
        with:
          name: preview-dist
          path: assets

      - name: Download release assets
        if: env.HAS_R2 == 'true' && needs.resolve.outputs.channel != 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ needs.resolve.outputs.tag }}" -R "${{ github.repository }}" -D assets

      # Rewrite both url and sig inside latest.json from github.com to the R2 CDN,
      # so the updater pulls the manifest AND the heavy artifacts from R2.
      - name: Rewrite latest.json URLs to R2
        if: env.HAS_R2 == 'true'
        env:
          R2_PUBLIC_BASE: https://dl.reasonix.io
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          f=assets/latest.json
          jq --arg base "$R2_PUBLIC_BASE" --arg tag "$TAG" '
            def rewrite_asset:
              .url |= sub("https://github.com/[^/]+/[^/]+/releases/download/[^/]+/"; "\($base)/\($tag)/")
              | .sig |= sub("https://github.com/[^/]+/[^/]+/releases/download/[^/]+/"; "\($base)/\($tag)/");
            .platforms |= with_entries(.value |= rewrite_asset)
            | if .native_packages then
                .native_packages |= with_entries(.value |= rewrite_asset)
              else . end
            | if .downloads then
                .downloads |= with_entries(.value |= rewrite_asset)
              else . end
          ' "$f" > "$f.new"
          mv "$f.new" "$f"
          cat "$f"

      - name: Validate R2 manifest before upload
        if: env.HAS_R2 == 'true'
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NOTES_VERSION: ${{ needs.resolve.outputs.notes_version }}
        run: |
          set -euo pipefail
          validation_channel="$CHANNEL"
          if [ "$CHANNEL" != "preview" ] && [ "$PRERELEASE" = "true" ]; then
            validation_channel="any"
          fi
          bash release-control/scripts/validate-desktop-release-manifest.sh \
            "$validation_channel" "$VERSION" \
            "https://dl.reasonix.io/${TAG}/" \
            assets/latest.json "$NOTES_VERSION"

      - name: Configure AWS CLI for R2
        if: env.HAS_R2 == 'true'
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Mirror immutable assets and advance R2 pointer
        id: mirror_r2
        if: env.HAS_R2 == 'true'
        env:
          DESKTOP_MANUAL_ONLY: ${{ inputs.desktop_manual_only || false }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NOTES_VERSION: ${{ needs.resolve.outputs.notes_version }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          download_optional() {
            local key="$1"
            local output="$2"
            local error_file
            error_file="$(mktemp)"
            if aws s3 cp "s3://${R2_BUCKET}/${key}" "$output" \
              --endpoint-url "$ENDPOINT" >/dev/null 2>"$error_file"; then
              rm -f "$error_file"
              return 0
            fi
            if grep -Eiq '404|NoSuchKey|Not Found' "$error_file"; then
              rm -f "$error_file"
              return 3
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            return 1
          }

          validation_channel="$CHANNEL"
          if [ "$CHANNEL" != "preview" ] && [ "$PRERELEASE" = "true" ]; then
            validation_channel="any"
          fi
          asset_base="https://dl.reasonix.io/${TAG}/"
          existing_manifest=false

          signature_verifier=/tmp/reasonix-desktop-sign
          go -C release-control/desktop build -o "$signature_verifier" ./cmd/sign
          verify_signature_directory() {
            local directory="$1"
            local signature payload
            while IFS= read -r -d '' signature; do
              payload="${signature%.minisig}"
              if [ ! -f "$payload" ]; then
                echo "::error::Desktop signature has no matching payload: $signature"
                return 1
              fi
              "$signature_verifier" verify "$payload"
            done < <(find "$directory" -type f -name '*.minisig' -print0)
          }
          require_signature_coverage() {
            local directory="$1"
            local payload
            while IFS= read -r -d '' payload; do
              if [ ! -s "$payload.minisig" ]; then
                echo "::error::Desktop payload has no non-empty signature: $payload"
                return 1
              fi
            done < <(find "$directory" -type f ! -name '*.minisig' ! -name 'latest.json' -print0)
          }
          verify_signature_directory assets
          require_signature_coverage assets

          # A version directory is immutable once written. Recovery may fill an
          # incomplete candidate subset, but it may never replace conflicting or
          # unexpected content, including an already-written latest.json.
          existing_directory="$(mktemp -d)"
          existing_keys="$(
            aws s3api list-objects-v2 \
              --bucket "$R2_BUCKET" \
              --prefix "${TAG}/" \
              --query 'Contents[].Key' \
              --output text \
              --endpoint-url "$ENDPOINT"
          )"
          if [ -n "$existing_keys" ] && [ "$existing_keys" != "None" ]; then
            aws s3 cp "s3://${R2_BUCKET}/${TAG}/" "$existing_directory/" \
              --recursive --endpoint-url "$ENDPOINT"
            verify_signature_directory "$existing_directory"
            if [ -f "$existing_directory/latest.json" ]; then
              existing_manifest=true
              bash release-control/scripts/validate-desktop-release-manifest.sh \
                "legacy-${validation_channel}" "$VERSION" "$asset_base" \
                "$existing_directory/latest.json" "$NOTES_VERSION"
              bash release-control/scripts/verify-desktop-release-manifest-assets.sh \
                "$existing_directory/latest.json" "$existing_directory"
              cp "$existing_directory/latest.json" assets/latest.json
            fi
            bash release-control/scripts/verify-desktop-release-directory.sh \
              --allow-missing --allow-legacy-manifest \
              --allow-authenticated-payload-differences assets "$existing_directory"

            # Preserve every already-published authenticated payload/signature
            # pair. Platform signing and packaging are non-deterministic, so a
            # recovery may fill missing pairs but must not replace valid ones.
            while IFS= read -r -d '' signature; do
              relative="${signature#"$existing_directory"/}"
              payload="${signature%.minisig}"
              payload_relative="${payload#"$existing_directory"/}"
              mkdir -p "assets/$(dirname "$relative")"
              cp "$payload" "assets/$payload_relative"
              cp "$signature" "assets/$relative"
            done < <(find "$existing_directory" -type f -name '*.minisig' -print0)
          fi

          aws s3 cp assets/ "s3://${R2_BUCKET}/${TAG}/" \
            --recursive \
            --exclude latest.json \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          if [ "$existing_manifest" != "true" ]; then
            aws s3 cp assets/latest.json "s3://${R2_BUCKET}/${TAG}/latest.json" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable"
          fi
          published_directory="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/${TAG}/" "$published_directory/" \
            --recursive --endpoint-url "$ENDPOINT"
          bash release-control/scripts/verify-desktop-release-directory.sh \
            --allow-legacy-manifest assets "$published_directory"
          verify_signature_directory "$published_directory"
          require_signature_coverage "$published_directory"
          bash release-control/scripts/verify-desktop-release-manifest-assets.sh \
            "$published_directory/latest.json" "$published_directory"

          aws s3 cp "s3://${R2_BUCKET}/${TAG}/latest.json" \
            /tmp/reasonix-desktop-tag-latest.json --endpoint-url "$ENDPOINT"
          bash release-control/scripts/validate-desktop-release-manifest.sh \
            "legacy-${validation_channel}" "$VERSION" "$asset_base" \
            /tmp/reasonix-desktop-tag-latest.json "$NOTES_VERSION"
          bash release-control/scripts/compare-desktop-release-manifests.sh \
            assets/latest.json /tmp/reasonix-desktop-tag-latest.json

          if [ "$DESKTOP_MANUAL_ONLY" = "true" ]; then
            echo "pointer_moved=false" >> "$GITHUB_OUTPUT"
            echo "Manual Desktop release: immutable downloads verified; automatic update pointers unchanged"
            exit 0
          fi

          # Internal RCs retain their immutable record but never move a public
          # channel pointer.
          if [ "$PRERELEASE" = "true" ] && [ "$CHANNEL" != "preview" ]; then
            echo "pointer_moved=false" >> "$GITHUB_OUTPUT"
            echo "internal Desktop prerelease $VERSION; public pointers remain unchanged"
            exit 0
          fi

          validate_current_pointer() {
            local current_channel="$1"
            local current_version="$2"
            local current_file="$3"
            local current_base="https://dl.reasonix.io/desktop-${current_version}/"
            if bash release-control/scripts/validate-desktop-release-manifest.sh \
              "$current_channel" "$current_version" "$current_base" \
              "$current_file"; then
              return 0
            fi

            if bash release-control/scripts/validate-desktop-release-manifest.sh \
              "legacy-${current_channel}" "$current_version" "$current_base" \
              "$current_file"; then
              echo "using legacy $current_channel manifest $current_version at its immutable base only as the monotonic migration baseline"
              return 0
            fi

            # Early Preview pointers referenced the mutable desktop-preview/
            # directory. Try that layout only after the immutable legacy layout
            # so later legacy pointers retain their version-bound asset URLs.
            local legacy_preview_base="https://dl.reasonix.io/desktop-preview/"
            if [ "$current_channel" = "preview" ] && \
              bash release-control/scripts/validate-desktop-release-manifest.sh \
                legacy-preview "$current_version" "$legacy_preview_base" \
                "$current_file"; then
              echo "using legacy Preview manifest $current_version at the rolling base only as the monotonic migration baseline"
              return 0
            fi
            echo "::error::existing Desktop $current_channel pointer is invalid"
            return 1
          }

          pointer_decision=""
          pointer_state=""
          if [ "$CHANNEL" = "preview" ]; then
            preview_manifest=-
            preview_version=""
            preview_download=/tmp/reasonix-desktop-current-preview.json
            if download_optional "preview/latest.json" "$preview_download"; then
              preview_version="$(jq -er '.version | strings' "$preview_download")"
              validate_current_pointer preview "$preview_version" "$preview_download"
              preview_manifest="$preview_download"
            else
              status=$?
              if [ "$status" -ne 3 ]; then
                exit "$status"
              fi
            fi

            canary_manifest=-
            canary_version=""
            canary_download=/tmp/reasonix-desktop-current-canary.json
            if download_optional "canary/latest.json" "$canary_download"; then
              canary_version="$(jq -er '.version | strings' "$canary_download")"
              validate_current_pointer preview "$canary_version" "$canary_download"
              canary_manifest="$canary_download"
            else
              status=$?
              if [ "$status" -ne 3 ]; then
                exit "$status"
              fi
            fi

            pointer_decision="$(
              bash release-control/scripts/decide-desktop-pointer-update.sh \
                preview assets/latest.json "$preview_manifest" "$canary_manifest"
            )"
            pointer_state="preview=${preview_version:-unset}, canary=${canary_version:-unset}"
          else
            current_version=""
            current_manifest=/tmp/reasonix-desktop-current-pointer.json
            if download_optional "latest/latest.json" "$current_manifest"; then
              current_version="$(jq -er '.version | strings' "$current_manifest")"
              validate_current_pointer stable "$current_version" "$current_manifest"
            else
              status=$?
              if [ "$status" -ne 3 ]; then
                exit "$status"
              fi
            fi
            pointer_decision="$(
              bash release-control/scripts/decide-desktop-pointer-update.sh \
                stable assets/latest.json \
                "$([ -n "$current_version" ] && printf '%s' "$current_manifest" || printf '%s' -)"
            )"
            pointer_state="${current_version:-unset}"
          fi

          IFS=$'\t' read -r pointer_action pointer_source <<< "$pointer_decision"
          if [ "$pointer_action" = "skip" ]; then
            echo "pointer_moved=false" >> "$GITHUB_OUTPUT"
            echo "Desktop $CHANNEL pointer remains $pointer_state; candidate $VERSION is not newer and needs no repair"
            exit 0
          fi
          if [ "$pointer_action" != "update" ] || [ ! -f "$pointer_source" ]; then
            echo "::error::invalid Desktop pointer decision: $pointer_decision"
            exit 1
          fi
          pointer_version="$(jq -er '.version | strings' "$pointer_source")"

          publish_pointer() {
            local destination="$1"
            local downloaded="/tmp/reasonix-desktop-${destination}-latest.json"
            aws s3 cp "$pointer_source" "s3://${R2_BUCKET}/${destination}/latest.json" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300, stale-if-error=86400"
            aws s3 cp "s3://${R2_BUCKET}/${destination}/latest.json" "$downloaded" \
              --endpoint-url "$ENDPOINT"
            validate_current_pointer "$CHANNEL" "$pointer_version" "$downloaded"
            cmp -s "$pointer_source" "$downloaded"
          }

          if [ "$CHANNEL" = "preview" ]; then
            # Write compatibility first. If the primary write fails, a rerun
            # still observes the old primary and safely retries both writes.
            publish_pointer canary
            publish_pointer preview
            if ! cmp -s /tmp/reasonix-desktop-canary-latest.json /tmp/reasonix-desktop-preview-latest.json; then
              echo "::error::Desktop Preview and Canary pointers diverged after publication"
              exit 1
            fi
          else
            publish_pointer latest
          fi
          echo "pointer_moved=true" >> "$GITHUB_OUTPUT"
          echo "pointer_version=$pointer_version" >> "$GITHUB_OUTPUT"
          echo "Desktop $CHANNEL pointer -> $pointer_version"

      # dl.reasonix.io serves 403 to GitHub Actions egress IPs (Cloudflare bot
      # protection), so smoke the mirrored objects over the authenticated S3 API
      # instead of the public edge. This verifies the mirror landed; the public
      # edge itself is not reachable from CI and is covered by end users' traffic.
      - name: Smoke desktop release pointers
        if: env.HAS_R2 == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          NOTES_VERSION: ${{ needs.resolve.outputs.notes_version }}
          POINTER_MOVED: ${{ steps.mirror_r2.outputs.pointer_moved }}
          POINTER_VERSION: ${{ steps.mirror_r2.outputs.pointer_version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          f=assets/latest.json
          validation_channel="$CHANNEL"
          if [ "$CHANNEL" != "preview" ] && [ "$PRERELEASE" = "true" ]; then
            validation_channel="any"
          fi
          asset_base="https://dl.reasonix.io/${TAG}/"
          bash release-control/scripts/validate-desktop-release-manifest.sh \
            "$validation_channel" "$VERSION" "$asset_base" "$f" "$NOTES_VERSION"

          aws s3 cp "s3://${R2_BUCKET}/${TAG}/latest.json" /tmp/reasonix-desktop-tag-latest.json --endpoint-url "$ENDPOINT"
          bash release-control/scripts/validate-desktop-release-manifest.sh \
            "legacy-${validation_channel}" "$VERSION" "$asset_base" \
            /tmp/reasonix-desktop-tag-latest.json "$NOTES_VERSION"
          bash release-control/scripts/compare-desktop-release-manifests.sh \
            "$f" /tmp/reasonix-desktop-tag-latest.json

          if [ "$POINTER_MOVED" = "true" ]; then
            pointer="latest"
            [ "$CHANNEL" = "preview" ] && pointer="preview"
            aws s3 cp "s3://${R2_BUCKET}/${pointer}/latest.json" /tmp/reasonix-desktop-pointer-latest.json --endpoint-url "$ENDPOINT"
            pointer_base="https://dl.reasonix.io/desktop-${POINTER_VERSION}/"
            if ! bash release-control/scripts/validate-desktop-release-manifest.sh \
              "$CHANNEL" "$POINTER_VERSION" "$pointer_base" \
              /tmp/reasonix-desktop-pointer-latest.json; then
              legacy_base="$pointer_base"
              [ "$CHANNEL" = "preview" ] && legacy_base="https://dl.reasonix.io/desktop-preview/"
              bash release-control/scripts/validate-desktop-release-manifest.sh \
                "legacy-${CHANNEL}" "$POINTER_VERSION" "$legacy_base" \
                /tmp/reasonix-desktop-pointer-latest.json
            fi
            if [ "$CHANNEL" = "preview" ]; then
              aws s3 cp "s3://${R2_BUCKET}/canary/latest.json" /tmp/reasonix-desktop-canary-latest.json --endpoint-url "$ENDPOINT"
              cmp -s /tmp/reasonix-desktop-pointer-latest.json /tmp/reasonix-desktop-canary-latest.json
            fi
          fi

          jq -r '(.platforms[] | .url, .sig), ((.native_packages // {})[] | .url, .sig), ((.downloads // {})[] | .url, .sig)' "$f" | while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            key="${asset#https://dl.reasonix.io/}"
            aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$ENDPOINT" >/dev/null
          done

      # Best-effort probe of the release gateway — the updater's second
      # manifest source — over the same public edge and Go client UA end users
      # hit. A 403 here is the known Cloudflare bot-protection gap (#6005:
      # datacenter/proxy egress gets blocked before the worker runs) and must
      # not fail the release until a WAF skip rule for /v1/desktop/releases/*
      # lands; it is surfaced as a warning so the run shows whether the edge
      # is open. Anything else unexpected (404, 5xx, wrong version) means the
      # gateway route or pointer regressed and fails hard.
      - name: Probe public release gateway
        if: env.HAS_R2 == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          POINTER_MOVED: ${{ steps.mirror_r2.outputs.pointer_moved }}
          POINTER_VERSION: ${{ steps.mirror_r2.outputs.pointer_version }}
        run: |
          set -euo pipefail
          if [ "$POINTER_MOVED" != "true" ]; then
            echo "Desktop $CHANNEL pointer did not move; skipping gateway probe"
            exit 0
          fi
          chan="stable"
          [ "$CHANNEL" = "preview" ] && chan="preview"
          url="https://crash.reasonix.io/v1/desktop/releases/${chan}/latest.json"
          # curl already prints 000 for a transport failure; || true keeps -e
          # from killing the step so the case below can route it.
          code="$(curl -sS -A "Go-http-client/2.0" -o /tmp/gateway-latest.json -w '%{http_code}' "$url" || true)"
          case "$code" in
            200)
              if jq -e --arg version "$POINTER_VERSION" '.version == $version' /tmp/gateway-latest.json >/dev/null; then
                echo "gateway serves $POINTER_VERSION on $chan"
              else
                echo "::error::gateway responded 200 but serves $(jq -r '.version // "<none>"' /tmp/gateway-latest.json), want $POINTER_VERSION — stale or wrong pointer"
                exit 1
              fi
              ;;
            403)
              echo "::warning::gateway returned 403 to CI egress — known bot-protection gap (#6005), not failing the release"
              ;;
            000|"")
              echo "::warning::gateway unreachable from CI (transport error), not failing the release"
              ;;
            *)
              echo "::error::gateway returned $code for $url — route or pointer regression"
              exit 1
              ;;
          esac

      - name: Attach desktop manifest to matching CLI release
        if: env.HAS_R2 == 'true' && needs.resolve.outputs.channel != 'preview' && needs.resolve.outputs.prerelease != 'true' && !inputs.desktop_manual_only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" assets/latest.json --clobber
          else
            echo "CLI release $VERSION does not exist yet; release.yml will attach the compatibility latest.json when it publishes."
          fi

      # Stable release moved R2 latest/ — rebuild the site so its build-time baked
      # version + JSON-LD follow (site.js's runtime .rxv refresh can't touch first paint / SEO).
      - name: Refresh site to the new version
        if: env.HAS_R2 == 'true' && needs.resolve.outputs.channel != 'preview' && needs.resolve.outputs.prerelease != 'true' && steps.mirror_r2.outputs.pointer_moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main-v2
