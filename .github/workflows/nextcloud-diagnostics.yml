name: Nextcloud integration diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextcloud-talk-bot
    paths:
      - .github/workflows/nextcloud-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: nextcloud-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nextcloud-talk-bot
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat .wails-version)"

      - name: Collect diagnostics without failing early
        shell: bash
        run: |
          set +e
          : > NEXTCLOUD_CI_DIAGNOSTICS.txt

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            echo "===== ${name} =====" >> NEXTCLOUD_CI_DIAGNOSTICS.txt
            "$@" >"$log" 2>&1
            code=$?
            echo "exit_code=${code}" >> NEXTCLOUD_CI_DIAGNOSTICS.txt
            tail -n 220 "$log" >> NEXTCLOUD_CI_DIAGNOSTICS.txt
            echo >> NEXTCLOUD_CI_DIAGNOSTICS.txt
            return 0
          }

          run_check root_go_test bash -lc 'go test ./...'
          run_check root_go_vet bash -lc 'go vet ./...'
          run_check repolint bash -lc 'go run ./tools/repolint'
          run_check diff_check bash -lc 'git diff --check'
          run_check frontend_build bash -lc 'cd desktop && wails generate module && pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build'
          run_check desktop_go_test bash -lc 'cd desktop && go test ./...'
          run_check frontend_typecheck bash -lc 'cd desktop/frontend && pnpm typecheck'

      - name: Commit diagnostic report safely
        shell: bash
        run: |
          set -euo pipefail
          cp NEXTCLOUD_CI_DIAGNOSTICS.txt /tmp/NEXTCLOUD_CI_DIAGNOSTICS.txt
          rm -f NEXTCLOUD_CI_DIAGNOSTICS.txt

          git fetch origin feature/nextcloud-talk-bot
          git rebase origin/feature/nextcloud-talk-bot

          cp /tmp/NEXTCLOUD_CI_DIAGNOSTICS.txt NEXTCLOUD_CI_DIAGNOSTICS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXTCLOUD_CI_DIAGNOSTICS.txt
          git commit -m "ci: record Nextcloud integration diagnostics"
          git push origin HEAD:feature/nextcloud-talk-bot
