name: Nextcloud integration diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextcloud-talk-bot
    paths:
      - .github/workflows/nextcloud-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: nextcloud-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nextcloud-talk-bot
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run affected Go tests and save output
        shell: bash
        run: |
          set +e
          go test ./internal/bot/nextcloudtalk ./internal/botruntime ./internal/config ./internal/cli > NEXTCLOUD_CI_DIAGNOSTICS.txt 2>&1
          code=$?
          printf '\nexit_code=%s\n' "$code" >> NEXTCLOUD_CI_DIAGNOSTICS.txt
          exit 0

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXTCLOUD_CI_DIAGNOSTICS.txt
          git commit -m "ci: record Nextcloud Go diagnostics"
          git push origin feature/nextcloud-talk-bot
