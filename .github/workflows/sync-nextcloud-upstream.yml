name: Sync Nextcloud branch with upstream

on:
  push:
    branches:
      - feature/nextcloud-talk-bot
    paths:
      - .github/workflows/sync-nextcloud-upstream.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nextcloud-talk-bot
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Merge latest upstream main-v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/esengine/DeepSeek-Reasonix.git
          git fetch upstream main-v2

          set +e
          git merge --no-edit upstream/main-v2
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "tools/repolint/baseline.json" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs tools/repolint/baseline.json
            git add tools/repolint/baseline.json
            git commit --no-edit
          fi

      - name: Refresh repolint baseline on merged tree
        run: go run ./tools/repolint -update

      - name: Clean temporary files and push
        run: |
          git rm .github/workflows/sync-nextcloud-upstream.yml
          git rm -f NEXTCLOUD_CI_DIAGNOSTICS.txt 2>/dev/null || true
          git rm -f SYNC_CONFLICTS.txt 2>/dev/null || true
          git add tools/repolint/baseline.json
          git commit -m "chore: refresh repolint baseline after upstream sync"
          git push origin feature/nextcloud-talk-bot
