name: Studio Windows self-test

# An unsigned Windows installer for trying a branch on a real machine before it
# is released. It runs on the intranet runner, so it is dispatch-only: the
# repository is public, and nothing a pull request writes may run there.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: false
        default: studio
        type: string

permissions:
  contents: read

concurrency:
  group: studio-selftest-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: win-gpu
    timeout-minutes: 90
    steps:
      # The machine's PATH finds WSL's bash before Git's, and a bash step run in
      # WSL sees neither this checkout's toolchain nor Windows paths. cmd, since
      # the machine's execution policy refuses the script a powershell step is.
      - name: Put Git Bash first on PATH
        shell: cmd
        run: '>>"%GITHUB_PATH%" echo C:\Program Files\Git\bin'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      # A patch above the newest release, as a prerelease: it ranks ahead of
      # what is published, so the build does not offer itself that release as
      # an update, and behind the next one, which it does offer.
      - name: Choose the version
        id: version
        shell: bash
        run: |
          latest="$(git ls-remote --tags origin 'refs/tags/studio-v*' | sed -n 's#.*refs/tags/studio-v\([0-9.]*\)$#\1#p' | sort -V | tail -1)"
          test -n "$latest" || { echo "::error::no studio-v* release tag"; exit 1; }
          IFS=. read -r major minor patch <<< "$latest"
          version="$major.$minor.$((patch + 1))-selftest.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: \`$version\` from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # The intranet's route to the module proxy drops connections now and then.
      # What arrives stays in this machine's module cache, so a retry resumes.
      - name: Fetch Go modules
        shell: bash
        run: for i in 1 2 3 4 5; do go mod download && exit 0; sleep 10; done; exit 1

      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build the kernel
        working-directory: desktop/electron
        shell: bash
        env:
          REASONIX_VERSION: v${{ steps.version.outputs.version }}
        run: pnpm install --frozen-lockfile && pnpm run build:host

      - name: Build the bundle
        working-directory: desktop/electron
        shell: bash
        run: pnpm exec electron-builder --dir -c.extraMetadata.version="${{ steps.version.outputs.version }}"

      - name: Package the installer
        working-directory: desktop/electron
        shell: bash
        run: |
          pnpm exec electron-builder --prepackaged ../../dist/win-unpacked --win nsis \
            -c.extraMetadata.version="${{ steps.version.outputs.version }}"
          sha256sum ../../dist/ReasonixStudio-windows-amd64-installer.exe | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-selftest-windows-${{ steps.version.outputs.version }}
          path: dist/ReasonixStudio-windows-amd64-installer.exe
          if-no-files-found: error
          retention-days: 7
