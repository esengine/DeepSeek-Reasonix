name: CI

on:
  push:
    branches: [main-v2]
  pull_request:
    branches: [main-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path gate for pull requests. PRs confined to docs/site/release-notes
  # (or top-level Markdown) skip the heavy Go jobs, and PRs that cannot affect
  # the desktop module skip the desktop jobs. Job-level `if` reports skipped,
  # which satisfies the required status checks (lint, race, test) — a
  # workflow-level paths-ignore would leave required checks pending and block
  # merges. Gated jobs skip only on an explicit `false` output: wrapped in
  # `always()`, a failed `changes` job (or a missing output) makes them run
  # the full matrix instead of silently passing required checks as skipped.
  # Pushes to main-v2 always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_go: ${{ steps.filter.outputs.desktop_go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      browser: ${{ steps.filter.outputs.browser }}
      memory: ${{ steps.filter.outputs.memory }}
      electron: ${{ steps.filter.outputs.electron }}
      native: ${{ steps.filter.outputs.native }}
      packaging: ${{ steps.filter.outputs.packaging }}
      site: ${{ steps.filter.outputs.site }}
      sdk: ${{ steps.filter.outputs.sdk }}
      notes_only: ${{ steps.filter.outputs.notes_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base "$BASE_SHA" --mode pull_request)
          else
            # Main pushes retain the complete qualification matrix after the
            # existing release-notes-only exception is evaluated.
            args+=(--base "$BASE_SHA" --mode push --full)
          fi
          node scripts/ci-paths.mjs "${args[@]}"

  # The ruleset requires the per-OS check names (test (ubuntu-latest) etc.).
  # A matrix job skipped at job level reports no per-leg checks at all, so
  # those required checks would stay "Expected" and block merging. The job
  # therefore always runs and the steps do the gating: when the changes
  # detector reports the diff is unrelated, every step skips and each leg
  # reports success in seconds. `always()` also keeps the legs alive when
  # the changes job itself fails (fail-open: an empty output != 'false').
  test:
    needs: changes
    if: always()
    # Backstop against a wedged step holding the workflow's concurrency group:
    # the Windows full-suite step has outlived its own timeout and kept the job
    # alive. Normal full-suite wall time is 8-12 minutes per platform.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Windows keeps setup-go's go.sum-keyed cache: restoring the per-run
          # cache there measured slower (17m -> 21m, then a 25-minute step
          # timeout), so the rolling cache serves only the Unix legs.
          cache: ${{ runner.os == 'Windows' }}

      - if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: Install and verify Linux sandbox backend
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: build
        if: env.RUN_STEPS == 'true'
        run: go build ./...

      - name: test
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

      # Agent, boot and control own isolated Windows runners on PRs and pushes.
      # The shared selector excludes them here, preserving platform smoke
      # coverage without competing durable-session I/O or duplicate execution.
      - name: test (Windows smoke)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: node scripts/windows-go-tests.mjs smoke

      # The general Windows PR smoke list intentionally omits internal/tool.
      # Keep the session-temp portability contract covered without widening the
      # leg to every tool test: two real PowerShell launches must share the
      # injected TMPDIR/TMP/TEMP directory.
      - name: test (Windows session temp)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 3
        run: go test -timeout=2m -run '^TestBashSharesSessionTempAcrossCalls$' ./internal/tool/builtin

      # Serve and taskmonitor are outside the general Windows PR smoke list.
      # Cover runtime identities and snapshot publication before mainline push.
      - name: test (Windows runtime status and task snapshots)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: go test -timeout=2m -run '^TestRuntimeStateHTTP|^TestFileStoreSaveTaskWaitsForTransientSnapshotReader$' ./internal/serve ./internal/taskmonitor

      # Shell execution contract: PowerShell identity, Chinese workspace paths,
      # UTF-8 output, and ExitCode retention must gate PRs on native Windows.
      # Keep this focused (not full ./internal/tool) so the smoke budget holds.
      - name: test (Windows shell execution contract)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: go test -timeout=3m -run '^TestBashPowerShellExecuteDetailedContract$|^TestBashPowerShell51PreflightRejectsAndAndDetailed$|^TestBashPowerShellOutputIsUTF8$|^TestBashPowerShellSurfacesNonZeroExit$|^TestBashPowerShellRejectsChaining$' ./internal/tool/builtin

      # Enumerate the entire module and run every remaining package. The union
      # with the isolated jobs is exhaustive and disjoint, including new packages.
      - name: test (full)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name != 'pull_request'
        timeout-minutes: 20
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
          # Bound sandbox helper children in Windows tests so a failed OS-level
          # launch cannot pin the Actions step after Go's package timeout fires.
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: node scripts/windows-go-tests.mjs full

      - name: test (Scoop desktop launch)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        run: .\scripts\test-scoop-desktop-launch.ps1

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v6
        if: always() && env.RUN_STEPS == 'true' && runner.os != 'Windows' && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  windows-control:
    needs: changes
    if: always()
    runs-on: windows-latest
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: test
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: node scripts/windows-go-tests.mjs control

  windows-isolated:
    needs: changes
    if: always() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [agent, boot]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }
      - name: test
        timeout-minutes: 10
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: node scripts/windows-go-tests.mjs ${{ matrix.group }}

  race:
    needs: changes
    if: always() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root-race

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage. Pull requests sweep only the
      # concurrency-heavy packages so this required check stays fast; pushes
      # to main-v2 keep the full ./... sweep as the safety net.
      - name: test -race (concurrency packages)
        if: github.event_name == 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./internal/agent/... ./internal/plugin/... ./internal/jobs/... ./internal/proc/... ./internal/sandbox/... ./internal/filelock/... ./internal/eventwire/... ./internal/remote/... ./internal/extension/... ./internal/boot/... ./internal/control/... ./internal/tool/...

      - name: test -race (full)
        if: github.event_name != 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./...

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # sdk/go is a nested stdlib-only module invisible to root `go test ./...`.
  # Its DTOs are generated from internal/extension/protocol, and the
  # host-side conformance tests spawn the SDK example, so the job runs the
  # same three-OS matrix as the root tests.
  sdk:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.sdk != 'false' }}
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: gofmt
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: stdlib-only guard
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          # The SDK is a public module with a hard stdlib-only contract.
          if go list -m all | grep -v '^github.com/esengine/DeepSeek-Reasonix/sdk/go$'; then
            echo "sdk/go must not depend on anything outside the standard library"
            exit 1
          fi

      - name: test
        if: env.RUN_STEPS == 'true'
        run: go test ./...

      - name: test -race
        if: github.event_name != 'pull_request' && env.RUN_STEPS == 'true'
        run: go test -race ./...

  desktop:
    needs: [changes, desktop-prepare, desktop-go, desktop-go-race, desktop-frontend, desktop-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREPARE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.desktop != 'false' }}
          NATIVE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false' }}
          FRONTEND_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GO_RESULT: ${{ needs.desktop-go.result }}
          GO_RACE_RESULT: ${{ needs.desktop-go-race.result }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          BROWSER_RESULT: ${{ needs.desktop-browser.result }}
        run: |
          test "$CHANGES_RESULT" = success
          expected() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          test "$PREPARE_RESULT" = "$(expected "$PREPARE_REQUIRED")"
          test "$GO_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$GO_RACE_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$FRONTEND_RESULT" = "$(expected "$FRONTEND_REQUIRED")"
          # The browser aggregate always runs and validates skipped groups itself.
          test "$BROWSER_RESULT" = success

  desktop-frontend:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"
      - name: Verify CI test coverage and runner
        run: node --test frontend/scripts/ci-test-plan.test.mjs
      - name: Check the Electron shell
        run: |
          pnpm --dir electron typecheck
          pnpm --dir electron test
          node --test packaging/*.test.mjs
          pnpm --dir electron build
      - name: Test desktop frontend once per suite
        env:
          REASONIX_TEST_CONCURRENCY: "2"
        run: node frontend/scripts/run-ci-tests.mjs

  desktop-browser-group:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.browser != 'false')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [app-settings-motion, transcript]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"
      - name: Install browser runtimes
        run: PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Test desktop browser group
        env:
          BROWSER_GROUP: ${{ matrix.group }}
          REASONIX_LAYOUT_ARTIFACTS: ${{ runner.temp }}/desktop-browser/${{ matrix.group }}/layout
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/desktop-browser/$BROWSER_GROUP"
          mkdir -p "$evidence"
          case "$BROWSER_GROUP" in
            app-settings-motion)
              PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend test:app-browser
              PLAYWRIGHT_BROWSERS_PATH=.pw-browsers REASONIX_SETTINGS_BROWSERS=chromium pnpm --dir frontend test:settings-browser
              pnpm --dir frontend test:motion-browser
              ;;
            transcript)
              xvfb-run -a env PLAYWRIGHT_BROWSERS_PATH=.pw-browsers REASONIX_TRANSCRIPT_NATIVE_THUMB=1 pnpm --dir frontend test:transcript-browser
              REASONIX_TRANSCRIPT_READER_BROWSERS=chromium PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend test:transcript-reader-browser
              ;;
            *) exit 2 ;;
          esac 2>&1 | tee "$evidence/run.log"

      - name: Upload browser group evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-browser-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-browser/${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 7

  desktop-browser:
    needs: [changes, desktop-prepare, desktop-browser-group]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop browser groups
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.browser != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GROUP_RESULT: ${{ needs.desktop-browser-group.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SHOULD_RUN" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$GROUP_RESULT" = success
          else
            test "$GROUP_RESULT" = skipped
          fi

  desktop-prepare:
    needs: changes
    if: always() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.desktop != 'false')
    outputs:
      stable_artifact_name: desktop-frontend-stable-${{ github.run_id }}-${{ github.run_attempt }}
      canary_artifact_name: desktop-frontend-canary-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale - run 'cd desktop && go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      # The packaged Electron shell embeds desktopContract.json; a stale
      # frontend/src/generated would ship a shell/service protocol mismatch.
      - name: Check desktop host contract drift
        run: |
          go run . -emit-contract frontend/src/generated
          if ! git diff --exit-code -- frontend/src/generated; then
            echo "desktop contract is stale - run 'cd desktop && go run . -emit-contract frontend/src/generated' and commit."
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build stable frontend
        run: pnpm --dir frontend build:electron

      - name: Record stable frontend artifact identity
        run: |
          node frontend/scripts/artifact-identity.mjs create \
            --shell electron \
            --channel stable \
            --source-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/frontend/dist
            desktop/frontend/.reasonix-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      # Static checks ran in the stable build. The canary variant still gets a
      # fresh Vite build and bundle-budget validation because its embedded
      # channel is part of the shipped bytes.
      - name: Build canary frontend
        env:
          REASONIX_CHANNEL: canary
        run: node frontend/scripts/build-for-shell.mjs electron --bundle-only

      - name: Record canary frontend artifact identity
        run: |
          node frontend/scripts/artifact-identity.mjs create \
            --shell electron \
            --channel canary \
            --source-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/frontend/dist
            desktop/frontend/.reasonix-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  desktop-go:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # `go test -race ./...` is ~7 of desktop-go's ~11 minutes and shares nothing
  # with vet, lint, build and the plain test run beyond the frontend artifact.
  # Running it beside them makes the job's wall time the longer half without
  # changing what is race-checked.
  desktop-go-race:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop-race

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # The extension work added new shared-state paths to the desktop
      # runtime (tab/rebuild fences, extension UI). Race-sweep the module so
      # regressions are CI-blocked, not just author-verified locally.
      - name: test -race
        run: go test -race ./...

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # desktop/ is a separate module, so the root macOS matrix above does not
  # compile or exercise the native PTY and FSEvents implementations.
  desktop-macos:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - name: Test integrated terminal, PTY, and FSEvents lifecycle
        run: go test -race -run 'Test(DarwinWorkspaceWatcher|WorkspaceChangeHub|ResolveTerminal|Terminal|EmptyTerminal|UnixTerminalProcess)' .

      - name: Test native macOS signing coverage
        run: node --test packaging/sign-macos.test.mjs

      - name: Test bounded Electron diagnostics
        timeout-minutes: 3
        run: node electron/scripts/performance-smoke.mjs

      # The production desktop build uses CGO. Keep the explicit unavailable
      # backend buildable as a fail-closed portability contract instead of
      # silently falling back to kqueue's per-file descriptor usage.
      - name: Test macOS build without CGO
        env:
          CGO_ENABLED: "0"
        run: go test -run '^TestDarwinWorkspaceWatcherWithoutCGOIsUnavailable$' .

      # desktop/*_darwin.go is the one build-tag set the lint job cannot reach:
      # the main-thread watchdog is cgo, so it only type-checks with a real
      # macOS toolchain.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      # Packaging validation, not a code gate: run it on pushes to main-v2 (the
      # release pipeline packages again anyway), and let pull requests stop
      # after the lint step. Ad-hoc signs (no Apple secrets in CI) and skips
      # the DMG.
      - name: Remove stable frontend before canary packaging
        if: github.event_name != 'pull_request'
        run: rm -rf frontend/dist frontend/.reasonix-frontend-artifact.json

      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend

      - name: Verify canary frontend artifact
        if: github.event_name != 'pull_request'
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - name: Package Electron app and verify bundle members
        if: github.event_name != 'pull_request'
        timeout-minutes: 25
        env:
          DESKTOP_BUILD_SKIP_DMG: "1"
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          ../scripts/desktop-build.sh darwin/arm64 v0.0.0-ci canary
          node packaging/verify.mjs ../dist/Reasonix-darwin-arm64.zip

      # Signing and bundle members do not prove the app starts. Until now the
      # packaged macOS renderer path ran only in the release build, so a
      # regression there surfaced at publication time instead of on main-v2.
      - name: Smoke-test the packaged macOS startup
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          ditto -xk ../dist/Reasonix-darwin-arm64.zip "$RUNNER_TEMP/desktop-startup"
          node packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Reasonix.app"

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v6
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # Desktop project-root matching is case-insensitive only on Windows
  # (sameDesktopPath folds case when os.PathSeparator is '\'), so the
  # regression tests for that contract are named *OnWindows and can never
  # run on the ubuntu leg above.
  desktop-windows:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false')
    runs-on: windows-latest
    # A hung native step must not hold the workflow's concurrency group for the
    # six-hour default. This bounds hangs, not duration: the leg's own spread on
    # 2026-09-11 was 34-47 minutes, so a cap near the mean cancels healthy runs.
    # Every step keeps its own tighter budget.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend
      - name: Verify canary frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      # test:motion, test:transcript-browser and test:settings-browser run on
      # ubuntu (desktop-frontend and desktop-browser). They were repeated here
      # when each OS shipped its own engine; Electron ships one Chromium, so the
      # Windows-specific renderer evidence is the native Electron step below.

      # Package the real Electron shell on every desktop PR and exercise the
      # production startup path (shell -> Go service handshake) in the packaged
      # layout. package.mjs builds the frontend itself (build:electron flavor).
      - name: Package Electron shell for native startup smoke
        timeout-minutes: 15
        env:
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          pnpm install --frozen-lockfile
          go build -trimpath -ldflags "-s -w -X main.version=v0.0.0-ci -X main.channel=canary" -o build/bin/reasonix-desktop.exe .
          node packaging/package.mjs windows/amd64 v0.0.0-ci canary

      - name: Smoke-test Electron native startup
        timeout-minutes: 3
        run: node packaging/smoke.mjs build/electron/windows-amd64/app --service build/bin/reasonix-desktop.exe

      - name: Test native window geometry on Windows
        timeout-minutes: 2
        run: node electron/scripts/window-geometry-smoke.mjs

      - name: Test transcript content bounds in native Electron
        timeout-minutes: 5
        env:
          REASONIX_LAYOUT_ARTIFACTS: ${{ runner.temp }}/transcript-layout-electron
        run: pnpm --dir frontend test:transcript-electron

      - name: Upload native transcript layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transcript-layout-electron-windows
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/transcript-layout-electron

      - name: Test bounded Electron diagnostics
        timeout-minutes: 3
        run: node electron/scripts/performance-smoke.mjs

  # The desktop Go suite shares nothing with the Electron and browser steps
  # beyond a built frontend for go:embed, and it is the leg's longest step by
  # far: the module that tests in 1.8 minutes on ubuntu takes ~17 on Windows,
  # ~11 of them compiling and linking the cgo-heavy root package before a
  # single test runs (GOCACHE restored, Defender excluded). Running it beside
  # the Electron steps makes the leg's wall time the longer half rather than
  # the sum, and a Go flake reruns only this job.
  desktop-windows-go:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false')
    runs-on: windows-latest
    # Measured 17.1-17.3 minutes on three consecutive main-v2 runs; bound
    # hangs, not duration.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Same Defender hazard as the Electron leg: exclusions keep Go test
      # binaries from crashing mid-syscall and freshly written files readable.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - name: test (Windows desktop and update helper)
        # Keep native Go output here. JSON mode forces verbose output into the
        # test cache and spent 8-10 minutes finalizing it on Windows runners.
        timeout-minutes: 25
        run: go test ./...

      - name: test (vendored systray identity)
        timeout-minutes: 2
        run: go test -timeout=60s fyne.io/systray

  # Installer packaging is packaging validation, not a code gate, and it shares
  # no state with the test steps above. It runs beside them instead of after
  # them so the Windows leg's wall time is the longer half rather than the sum,
  # and so a packaging failure costs a short rerun instead of the whole leg.
  # Pushes to main-v2 only: the release pipeline builds installers again anyway.
  desktop-windows-package:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true')
    runs-on: windows-latest
    # Packaging measured 13m55s; the overhead benchmark and its workspace
    # install add about six more. Bound hangs, not duration.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Same Defender hazard as the test leg: exclusions keep packaging from
      # tripping over freshly written files that are still held open.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend
      - name: Verify canary frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - name: Install NSIS
        run: pwsh -NoProfile -File ../scripts/install-nsis.ps1

      - name: Build Windows installer and portable archive
        timeout-minutes: 20
        env:
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          ../scripts/desktop-build.sh windows/amd64 v0.0.0-ci canary

      - name: Verify packaged Windows artifacts
        run: |
          node packaging/verify.mjs ../dist/Reasonix-windows-amd64.zip
          node packaging/signing-files.mjs build/windows/signing-payload --check

      # The overhead benchmark asserts no threshold: it only records
      # overhead.json as 7-day evidence. It ran on the test leg, where its ~5
      # minutes sat on the critical path and its numbers came from the runner
      # with the widest spread. Keep it on Windows for comparable history, but
      # on the push-only leg that has the headroom.
      - name: Install the Electron workspace
        run: pnpm install --frozen-lockfile

      - name: Measure Electron diagnostic overhead
        timeout-minutes: 10
        run: node electron/scripts/performance-benchmark.mjs

      - name: Upload diagnostic benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-overhead-windows
          if-no-files-found: ignore
          retention-days: 7
          path: |
            desktop/electron/artifacts/performance/overhead.json
            desktop/electron/artifacts/performance/diagnostic-report.png

  ci-metrics:
    needs: [desktop, desktop-macos, desktop-windows, desktop-windows-go, desktop-windows-package]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Summarize queue, execution and stage timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          node scripts/ci-timings.mjs \
            --run "$RUNNER_TEMP/ci-run.json" \
            --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --title "Frontend CI timing"

  # Every main-v2 push saves one Go cache per Unix OS and module (~2.6 GiB
  # measured) against a 10 GiB repository limit shared with pnpm, CodeQL and
  # setup-go caches; two pushes filled it. Keep only the newest cache per
  # prefix once the savers are done; restore-keys pick the newest anyway.
  prune-go-cache:
    needs: [test, race, desktop-go, desktop-go-race, desktop-macos]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the newest Go cache per OS and module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A seen
          while read -r id key; do
            [ -n "$id" ] || continue
            prefix="${key%-*-*-*}"
            if [ -n "${seen[$prefix]:-}" ]; then
              echo "deleting older cache $key"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null
            else
              seen[$prefix]=1
              echo "keeping newest cache $key"
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&sort=created_at&direction=desc" --paginate \
            --jq '.actions_caches[] | select(.key | startswith("go-")) | "\(.id) \(.key)"')

  # repolint scans desktop/ and sdk/ too, so this job also runs for diffs the
  # `code` filter would otherwise skip.
  lint-code:
    needs: changes
    if: always() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: repo standards
        run: go run ./tools/repolint

      # `make lint-install` reads the same file, so a local run and this job
      # cannot drift onto different linter versions.
      - id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      # The step above only type-checks the linux/amd64 build, so every
      # //go:build windows and //go:build darwin file in the tree went unlinted.
      # Both modules cross-check without a toolchain; desktop under darwin does
      # not, because its bundle icon repair is cgo, so that leg lives in
      # desktop-macos.
      - name: golangci-lint (cross-platform build tags)
        run: |
          set -euo pipefail
          command -v golangci-lint
          for target in "darwin ." "windows ." "windows desktop"; do
            read -r target_os target_dir <<< "$target"
            echo "::group::golangci-lint GOOS=$target_os ($target_dir)"
            (cd "$target_dir" && GOOS="$target_os" golangci-lint run --timeout=5m ./...)
            echo "::endgroup::"
          done

      - name: release workflow contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            -ignore 'label "macos-15-intel" is unknown' \
            .github/workflows/release-stable.yml \
            .github/workflows/prepare-release-notes.yml \
            .github/workflows/release-stable-trigger.yml \
            .github/workflows/release.yml \
            .github/workflows/release-npm.yml \
            .github/workflows/release-desktop.yml \
            .github/workflows/apple-notary-log.yml \
            .github/workflows/macos-signing-check.yml \
            .github/workflows/release-verify-issues.yml \
            .github/workflows/docs-impact.yml \
            .github/workflows/ci.yml
          node --test scripts/desktop-release-artifacts.test.mjs scripts/signpath-checkpoint.test.mjs scripts/ci-workflow.test.mjs scripts/notarize-desktop.test.mjs scripts/windows-go-tests.test.mjs
          bash scripts/release-workflows.test.sh
          node scripts/check-single-release-public-contract.mjs

  # `lint` is a protected check name. Keep it as the fail-closed aggregate so
  # frontend unit coverage can run once in desktop-frontend without weakening
  # the branch gate.
  lint:
    needs: [changes, lint-code, desktop-prepare, desktop-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and frontend validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_CODE_RESULT: ${{ needs.lint-code.result }}
          LINT_CODE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false' }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          FRONTEND_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false' }}
        run: |
          test "$CHANGES_RESULT" = success
          lint_expected=skipped
          if [ "$LINT_CODE_REQUIRED" = true ]; then lint_expected=success; fi
          test "$LINT_CODE_RESULT" = "$lint_expected"
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi

  # The site/ auth client has security-sensitive redirect-validation logic
  # (safeNext) covered by node:test unit tests. Those tests use only Node
  # builtins, so no `npm install` is needed — run them directly on every PR so
  # a regression in redirect validation fails the build instead of shipping.
  site:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.site != 'false')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: test
        run: npm test

  govulncheck:
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true')
    runs-on: ubuntu-latest
    continue-on-error: true # informational — stdlib vulns need a Go patch release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  coverage:
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true

      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
