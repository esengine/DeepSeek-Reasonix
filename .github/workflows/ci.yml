name: CI

on:
  push:
    branches: [main-v2]
  pull_request:
    branches: [main-v2]

permissions:
  contents: read

concurrency:
  # Push cancellation is handled by Supersede CI, which preserves the code
  # ancestor still required by a release-notes-only candidate.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path gate for pull requests. PRs confined to docs/site/release-notes
  # (or top-level Markdown) skip the heavy Go jobs, and PRs that cannot affect
  # the desktop module skip the desktop jobs. Job-level `if` reports skipped,
  # which satisfies the required status checks (lint, race, test) — a
  # workflow-level paths-ignore would leave required checks pending and block
  # merges. Gated jobs skip only on an explicit `false` output: wrapped in
  # `always()`, a failed `changes` job (or a missing output) makes them run
  # the full matrix instead of silently passing required checks as skipped.
  # Pushes to main-v2 always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_go: ${{ steps.filter.outputs.desktop_go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      browser: ${{ steps.filter.outputs.browser }}
      memory: ${{ steps.filter.outputs.memory }}
      electron: ${{ steps.filter.outputs.electron }}
      native: ${{ steps.filter.outputs.native }}
      packaging: ${{ steps.filter.outputs.packaging }}
      site: ${{ steps.filter.outputs.site }}
      sdk: ${{ steps.filter.outputs.sdk }}
      windows_builtin: ${{ steps.filter.outputs.windows_builtin }}
      release_control: ${{ steps.filter.outputs.release_control }}
      notes_only: ${{ steps.filter.outputs.notes_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base "$BASE_SHA" --mode pull_request)
          else
            # Main pushes retain the complete qualification matrix after the
            # existing release-notes-only exception is evaluated.
            args+=(--base "$BASE_SHA" --mode push --full)
          fi
          node scripts/ci-paths.mjs "${args[@]}"

  # The ruleset requires the per-OS check names (test (ubuntu-latest) etc.).
  # A matrix job skipped at job level reports no per-leg checks at all, so
  # those required checks would stay "Expected" and block merging. The job
  # therefore always runs and the steps do the gating: when the changes
  # detector reports the diff is unrelated, every step skips and each leg
  # reports success in seconds. `always()` also keeps the legs alive when
  # the changes job itself fails (fail-open: an empty output != 'false').
  test:
    needs: changes
    if: ${{ !cancelled() }}
    # Backstop against a wedged step holding the workflow's concurrency group:
    # the Windows full-suite step has outlived its own timeout and kept the job
    # alive. Normal full-suite wall time is 8-12 minutes per platform.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Windows keeps setup-go's go.sum-keyed cache: restoring the per-run
          # cache there measured slower (17m -> 21m, then a 25-minute step
          # timeout), so the rolling cache serves only the Unix legs.
          cache: ${{ runner.os == 'Windows' }}

      - if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      # Both non-Linux legs drive their package selection through a Node script.
      - if: env.RUN_STEPS == 'true' && runner.os != 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; fail this lane when the prerequisite
      # cannot be established so a DEP crash is never treated as product evidence.
      - name: Exclude build dirs from Defender scanning
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              throw "Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: Install and verify Linux sandbox backend
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: env.RUN_STEPS == 'true' && runner.os != 'Windows'
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: build
        if: env.RUN_STEPS == 'true'
        run: go build ./...

      - name: test
        # Windows full coverage belongs to the disjoint selectors below and
        # the isolated jobs; running ./... here would execute every test twice.
        if: env.RUN_STEPS == 'true' && (runner.os == 'Linux' || (runner.os == 'macOS' && github.event_name != 'pull_request'))
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

      # Public repositories get five concurrent macOS runners and one pull
      # request already claims three. Linux proves the portable packages on
      # every pull request, so this leg sweeps only the darwin-specific ones
      # and pushes keep the full ./... run above — the same tiering the Windows
      # legs and the race job already use.
      - name: test (macOS platform packages)
        if: env.RUN_STEPS == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: node scripts/macos-go-tests.mjs darwin

      # ACP, Agent, Bot, boot and control own isolated Windows runners on PRs
      # and pushes. ACP and Bot previously competed in the residual -p=4 lane:
      # that hid ACP event ordering behind scheduler delay and made native Bot
      # crash evidence inseparable from other package processes.
      # The shared selector excludes them here, preserving platform smoke
      # coverage without competing durable-session I/O or duplicate execution.
      - name: test (Windows smoke)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: node scripts/windows-go-tests.mjs smoke

      - name: test (Windows credential ACL identity)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 3
        run: go test -timeout=2m -run '^TestCredentialAccessRepairsLegacyCredentialDeny|^TestRepairLegacyCredentialDenyMatchesFileAcrossPathAliases$' ./internal/config ./internal/winaclresidue

      # The PR smoke selector omits session; exercise native rename, writer-lock
      # release, and interrupted purge recovery before accepting lifecycle fixes.
      - name: test (Windows purge recovery)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: go test -timeout=3m -run '^TestPurge' ./internal/session

      # Serve and taskmonitor are outside the general Windows PR smoke list.
      # Cover runtime identities and snapshot publication before mainline push.
      - name: test (Windows runtime status and task snapshots)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: go test -timeout=2m -run '^TestRuntimeStateHTTP|^TestFileStoreSaveTaskWaitsForTransientSnapshotReader$' ./internal/serve ./internal/taskmonitor

      # Keep the platform contract in one selector with coverage assertions:
      # primary shell registration, timeout/schema/session temp, unsupported OS
      # sandbox behavior, ACP ordering, and Bot stop publication all gate PRs.
      - name: test (Windows shell and lifecycle contract)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 10
        env:
          WINDOWS_BUILTIN_FULL: ${{ needs.changes.outputs.windows_builtin }}
        run: node scripts/windows-pr-contract-tests.mjs

      - name: test (Windows persistent PowerShell 7 and 5.1)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:REASONIX_TEST_PWSH = (Get-Command pwsh).Source
          go test -timeout=2m -run '^TestPowerShell' ./internal/persistentshell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:REASONIX_TEST_PWSH = (Get-Command powershell.exe).Source
          go test -timeout=2m -run '^TestPowerShell' ./internal/persistentshell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Enumerate the entire module and run every remaining package. The union
      # with the isolated jobs is exhaustive and disjoint, including new packages.
      - name: test (full)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name != 'pull_request'
        timeout-minutes: 20
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: node scripts/windows-go-tests.mjs full

      - name: test (Scoop desktop launch)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        run: .\scripts\test-scoop-desktop-launch.ps1

      - name: test (Windows installer acceptance harness)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          ./scripts/test-windows-installer-startup.test.ps1
          ./scripts/test-windows-upgrade-startup.test.ps1

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v4
        if: always() && env.RUN_STEPS == 'true' && runner.os != 'Windows' && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  windows-control:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; fail this lane when the prerequisite
      # cannot be established so a DEP crash is never treated as product evidence.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              throw "Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: test
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: node scripts/windows-go-tests.mjs control

  windows-isolated:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [acp, agent, boot, bot, serve, session, worktree]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A hardware exception on a host whose CPU saves a large XSTATE (Intel
      # AMX) can corrupt the Go heap (golang/go#81238). Record the processor on
      # the same isolated runner so any remaining native crash is attributable.
      - name: runner CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; fail this lane when the prerequisite
      # cannot be established so a DEP crash is never treated as product evidence.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              throw "Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }
      - name: test
        # The worktree group normally approaches ten minutes on hosted runners.
        # Keep the script's 8m Go timeout authoritative and leave time to report it.
        timeout-minutes: 15
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: node scripts/windows-go-tests.mjs ${{ matrix.group }}

  race:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root-race

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage. Pull requests sweep only the
      # concurrency-heavy packages so this required check stays fast; pushes
      # to main-v2 keep the full ./... sweep as the safety net.
      - name: test -race (concurrency packages)
        if: github.event_name == 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./internal/agent/... ./internal/plugin/... ./internal/jobs/... ./internal/proc/... ./internal/sandbox/... ./internal/filelock/... ./internal/eventwire/... ./internal/remote/... ./internal/extension/... ./internal/boot/... ./internal/control/... ./internal/tool/... ./internal/bot/...

      - name: test -race (full)
        if: github.event_name != 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        # The session suite reached its final history tests after 580s; Go's
        # default 10m package alarm killed a test that had run for only 20s.
        run: go test -race -timeout=15m ./...

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # sdk/go is a nested stdlib-only module invisible to root `go test ./...`.
  # Its DTOs are generated from internal/extension/protocol, and the
  # host-side conformance tests spawn the SDK example, so the job runs the
  # same three-OS matrix as the root tests.
  sdk:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.sdk != 'false' }}
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: gofmt
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: stdlib-only guard
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          # The SDK is a public module with a hard stdlib-only contract.
          if go list -m all | grep -v '^github.com/esengine/DeepSeek-Reasonix/sdk/go$'; then
            echo "sdk/go must not depend on anything outside the standard library"
            exit 1
          fi

      - name: test
        if: env.RUN_STEPS == 'true'
        run: go test ./...

      - name: test -race
        if: github.event_name != 'pull_request' && env.RUN_STEPS == 'true'
        run: go test -race ./...

  # Required check. Every desktop job reaches the ruleset through this one name,
  # so a job that is not listed here is not gated at all: that is how a failing
  # desktop-windows-go merged. PACKAGE_REQUIRED mirrors desktop-windows-package's
  # own `if:` verbatim rather than testing for `push`, so workflow_dispatch does
  # not expect a skip from a job that runs.
  # Status functions bypass implicit success(): still aggregate failed children,
  # but release the concurrency slot when a newer head cancels this whole run.
  desktop:
    needs: [changes, desktop-prepare, desktop-go, desktop-go-race, desktop-frontend, desktop-browser,
            desktop-macos, desktop-windows, desktop-windows-go, desktop-windows-package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREPARE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.desktop != 'false' }}
          NATIVE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false' }}
          FRONTEND_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false' }}
          PACKAGE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.packaging != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GO_RESULT: ${{ needs.desktop-go.result }}
          GO_RACE_RESULT: ${{ needs.desktop-go-race.result }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          BROWSER_RESULT: ${{ needs.desktop-browser.result }}
          MACOS_RESULT: ${{ needs.desktop-macos.result }}
          WINDOWS_RESULT: ${{ needs.desktop-windows.result }}
          WINDOWS_GO_RESULT: ${{ needs.desktop-windows-go.result }}
          PACKAGE_RESULT: ${{ needs.desktop-windows-package.result }}
        run: |
          test "$CHANGES_RESULT" = success
          expected() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          test "$PREPARE_RESULT" = "$(expected "$PREPARE_REQUIRED")"
          test "$GO_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$GO_RACE_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$FRONTEND_RESULT" = "$(expected "$FRONTEND_REQUIRED")"
          # The browser aggregate always runs and validates skipped groups itself.
          test "$BROWSER_RESULT" = success
          # native ⇒ desktop by construction, so these can never contradict
          # PREPARE_REQUIRED above.
          test "$MACOS_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$WINDOWS_RESULT" = "$(expected "$NATIVE_REQUIRED")"
          test "$WINDOWS_GO_RESULT" = success
          test "$PACKAGE_RESULT" = "$(expected "$PACKAGE_REQUIRED")"

  desktop-frontend:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"
      - name: Verify CI test coverage and runner
        run: node --test frontend/scripts/ci-test-plan.test.mjs
      - name: Check the Electron shell
        run: |
          pnpm --dir electron typecheck
          pnpm --dir electron test
          node --test packaging/*.test.mjs
          pnpm --dir electron build
      - name: Test desktop frontend once per suite
        env:
          REASONIX_TEST_CONCURRENCY: "2"
        run: node frontend/scripts/run-ci-tests.mjs

  desktop-browser-group:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [app-settings-motion, transcript]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"
      - name: Install browser runtimes
        run: PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Install isolated native input driver
        if: matrix.group == 'transcript'
        run: sudo apt-get update && sudo apt-get install -y xdotool
      - name: Test native browser foreground runtime
        if: matrix.group == 'transcript'
        timeout-minutes: 3
        run: xvfb-run -a node electron/scripts/browser-runtime-smoke.mjs
      - name: Upload Linux browser runtime evidence
        if: always() && matrix.group == 'transcript'
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-linux
          path: desktop/electron/artifacts/browser-runtime/
          if-no-files-found: warn
      - name: Test submission handoff in Chromium
        if: matrix.group == 'transcript'
        timeout-minutes: 4
        env:
          REASONIX_HANDOFF_EVIDENCE: ${{ runner.temp }}/desktop-browser/transcript/submission-chromium
        run: pnpm --dir frontend test:submission-browser
      - name: Test submission handoff with native Electron input
        if: matrix.group == 'transcript'
        timeout-minutes: 4
        env:
          REASONIX_HANDOFF_EVIDENCE: ${{ runner.temp }}/desktop-browser/transcript/submission-electron
        run: xvfb-run -a pnpm --dir frontend test:submission-electron --native-input
      - name: Test desktop browser group
        env:
          BROWSER_GROUP: ${{ matrix.group }}
          REASONIX_LAYOUT_ARTIFACTS: ${{ runner.temp }}/desktop-browser/${{ matrix.group }}/layout
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/desktop-browser/$BROWSER_GROUP"
          mkdir -p "$evidence"
          case "$BROWSER_GROUP" in
            app-settings-motion)
              PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend test:app-browser
              PLAYWRIGHT_BROWSERS_PATH=.pw-browsers REASONIX_SETTINGS_BROWSERS=chromium pnpm --dir frontend test:settings-browser
              pnpm --dir frontend test:motion-browser
              ;;
            transcript)
              # The fixture resolves .pw-browsers from frontend, not this shell's desktop cwd.
              REASONIX_MAINTENANCE_EVIDENCE="$evidence/maintenance" \
                pnpm --dir frontend test:maintenance-browser
              xvfb-run -a env PLAYWRIGHT_BROWSERS_PATH=.pw-browsers REASONIX_TRANSCRIPT_NATIVE_THUMB=1 \
                REASONIX_TRANSCRIPT_MODE=native-scrollbar REASONIX_LAYOUT_ARTIFACTS="$evidence/native-scrollbar" \
                pnpm --dir frontend test:transcript-browser
              REASONIX_TRANSCRIPT_READER_BROWSERS=chromium PLAYWRIGHT_BROWSERS_PATH=.pw-browsers \
                REASONIX_TRANSCRIPT_MODE=headless-reader REASONIX_LAYOUT_ARTIFACTS="$evidence/headless-reader" \
                pnpm --dir frontend test:transcript-reader-browser
              ;;
            *) exit 2 ;;
          esac 2>&1 | tee "$evidence/run.log"

      - name: Upload browser group evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-browser-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-browser/${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 7

  desktop-browser:
    needs: [changes, desktop-prepare, desktop-browser-group]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop browser groups
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.browser != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GROUP_RESULT: ${{ needs.desktop-browser-group.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SHOULD_RUN" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$GROUP_RESULT" = success
          else
            test "$GROUP_RESULT" = skipped
          fi

  desktop-prepare:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.desktop != 'false') }}
    env:
      REASONIX_COMMIT: ${{ github.sha }}
    outputs:
      producer_attempt: ${{ steps.artifact-identity.outputs.attempt }}
      stable_artifact_name: desktop-frontend-stable-${{ github.run_id }}-${{ steps.artifact-identity.outputs.attempt }}
      canary_artifact_name: desktop-frontend-canary-${{ github.run_id }}-${{ steps.artifact-identity.outputs.attempt }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Capture frontend artifact producer identity
        id: artifact-identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale - run 'cd desktop && go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      # The packaged Electron shell embeds desktopContract.json; a stale
      # frontend/src/generated would ship a shell/service protocol mismatch.
      - name: Check desktop host contract drift
        run: |
          go run . -emit-contract frontend/src/generated
          if ! git diff --exit-code -- frontend/src/generated; then
            echo "desktop contract is stale - run 'cd desktop && go run . -emit-contract frontend/src/generated' and commit."
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build stable frontend
        run: pnpm --dir frontend build:electron

      - name: Record stable frontend artifact identity
        run: |
          node frontend/scripts/artifact-identity.mjs create \
            --shell electron \
            --channel stable \
            --source-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/frontend/dist
            desktop/frontend/sourcemaps/${{ github.sha }}
            desktop/frontend/.reasonix-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      # Static checks ran in the stable build. The canary variant still gets a
      # fresh Vite build and bundle-budget validation because its embedded
      # channel is part of the shipped bytes.
      - name: Build canary frontend
        env:
          REASONIX_CHANNEL: canary
        run: node frontend/scripts/build-for-shell.mjs electron --bundle-only

      - name: Record canary frontend artifact identity
        run: |
          node frontend/scripts/artifact-identity.mjs create \
            --shell electron \
            --channel canary \
            --source-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --pnpm-version "$(pnpm --version)"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/frontend/dist
            desktop/frontend/sourcemaps/${{ github.sha }}
            desktop/frontend/.reasonix-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  desktop-go:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      - name: build
        run: go build ./...

      - name: test
        # Keep every test, with independent package alarms for history versions.
        run: node ../scripts/desktop-windows-go-tests.mjs --all

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # The full desktop race package exceeded Go's ten-minute package alarm.
  # Reuse the verified test partition to keep complete coverage in parallel.
  desktop-go-race:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [A-B, C, D, E-H, I-P, Q-S, T-Z, history-3-5, history-6-7, history-8-9, history-10-11]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop-race

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # The extension work added new shared-state paths to the desktop
      # runtime (tab/rebuild fences, extension UI). Race-sweep the module so
      # regressions are CI-blocked, not just author-verified locally.
      - name: test -race
        run: node ../scripts/desktop-windows-go-tests.mjs ${{ matrix.group }} --race

      # One shard saves the shared compiler cache; all shards restore it.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.group == 'A-B' && steps.gocache.outputs.key != '' }}
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # desktop/ is a separate module, so the root macOS matrix above does not
  # compile or exercise the native PTY and FSEvents implementations.
  desktop-macos:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"

      - name: Test integrated terminal, PTY, and FSEvents lifecycle
        run: go test -race -run 'Test(DarwinWorkspaceWatcher|WorkspaceChangeHub|ResolveTerminal|Terminal|EmptyTerminal|UnixTerminalProcess)' .

      - name: Test native macOS signing coverage
        run: node --test packaging/sign-macos.test.mjs

      - name: Test native graphics recovery
        timeout-minutes: 3
        run: node electron/scripts/graphics-recovery-smoke.mjs

      - name: Test native browser runtime and 100 capture lifecycles
        timeout-minutes: 5
        env:
          REASONIX_BROWSER_CYCLES: "100"
        run: node electron/scripts/browser-runtime-smoke.mjs

      - name: Upload macOS browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-macos
          path: desktop/electron/artifacts/browser-runtime/
          if-no-files-found: warn

      - name: Test bounded Electron diagnostics
        timeout-minutes: 3
        run: |
          # @electron/get downloads the platform binary lazily. GitHub's
          # release endpoint occasionally returns a transient 504; retry only
          # that dependency fetch and keep all product/test failures fatal.
          set +e
          for attempt in 1 2 3; do
            output="$(node electron/scripts/performance-smoke.mjs 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! printf '%s\n' "$output" | grep -Eq 'HTTPError: Response code (429|5[0-9][0-9])|Electron failed to install correctly'; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Electron binary fetch failed transiently; retrying ($attempt/3)"
              sleep 5
            fi
          done
          exit "$status"

      # The production desktop build uses CGO. Keep the explicit unavailable
      # backend buildable as a fail-closed portability contract instead of
      # silently falling back to kqueue's per-file descriptor usage.
      - name: Test macOS build without CGO
        env:
          CGO_ENABLED: "0"
        run: go test -run '^TestDarwinWorkspaceWatcherWithoutCGOIsUnavailable$' .

      # desktop/*_darwin.go is the one build-tag set the lint job cannot reach:
      # the main-thread watchdog is cgo, so it only type-checks with a real
      # macOS toolchain.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      # Packaging validation, not a code gate: run it on pushes to main-v2 (the
      # release pipeline packages again anyway), and let pull requests stop
      # after the lint step. Ad-hoc signs (no Apple secrets in CI) and skips
      # the DMG.
      - name: Remove stable frontend before canary packaging
        if: github.event_name != 'pull_request'
        run: rm -rf frontend/dist frontend/.reasonix-frontend-artifact.json

      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend

      - name: Verify canary frontend artifact
        if: github.event_name != 'pull_request'
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"

      - name: Package Electron app and verify bundle members
        if: github.event_name != 'pull_request'
        timeout-minutes: 25
        env:
          DESKTOP_BUILD_SKIP_DMG: "1"
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
          REASONIX_FRONTEND_PRODUCER_ATTEMPT: ${{ needs.desktop-prepare.outputs.producer_attempt }}
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          ../scripts/desktop-build.sh darwin/arm64 v0.0.0-ci canary
          node packaging/verify.mjs ../dist/Reasonix-darwin-arm64.zip

      # Signing and bundle members do not prove the app starts. Until now the
      # packaged macOS renderer path ran only in the release build, so a
      # regression there surfaced at publication time instead of on main-v2.
      - name: Smoke-test the packaged macOS startup
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          ditto -xk ../dist/Reasonix-darwin-arm64.zip "$RUNNER_TEMP/desktop-startup"
          node packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Reasonix.app"

      # Only main-v2 pushes save, one job per OS and module, so the cache
      # stays a few pushes deep instead of churning on every pull request.
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && steps.gocache.outputs.key != ''
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.key }}

  # Desktop project-root matching is case-insensitive only on Windows
  # (sameDesktopPath folds case when os.PathSeparator is '\'), so the
  # regression tests for that contract are named *OnWindows and can never
  # run on the ubuntu leg above.
  desktop-windows:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false') }}
    runs-on: windows-latest
    # A hung native step must not hold the workflow's concurrency group for the
    # six-hour default. This bounds hangs, not duration: the leg's own spread on
    # 2026-09-11 was 34-47 minutes, so a cap near the mean cancels healthy runs.
    # Every step keeps its own tighter budget.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Defender real-time scanning on GitHub Windows runners intermittently
      # crashes Go test binaries mid-syscall (DEP fault at PC=0 in the Windows
      # syscall trampoline, e.g. golang/go#67139) and briefly keeps freshly
      # written test files open, causing flaky sharing violations. Exclude the
      # ephemeral build/test locations; failures stay non-fatal warnings.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend
      - name: Verify canary frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"

      # test:motion, test:transcript-browser and test:settings-browser run on
      # ubuntu (desktop-frontend and desktop-browser). They were repeated here
      # when each OS shipped its own engine; Electron ships one Chromium, so the
      # Windows-specific renderer evidence is the native Electron step below.

      # Package the real Electron shell on every desktop PR and exercise the
      # production startup path (shell -> Go service handshake) in the packaged
      # layout. package.mjs builds the frontend itself (build:electron flavor).
      - name: Package Electron shell for native startup smoke
        timeout-minutes: 15
        env:
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
          REASONIX_FRONTEND_PRODUCER_ATTEMPT: ${{ needs.desktop-prepare.outputs.producer_attempt }}
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          pnpm install --frozen-lockfile
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=v0.0.0-ci -X main.channel=canary" -o build/bin/reasonix-desktop.exe .
          node ../scripts/verify-windows-gui-subsystem.mjs build/bin/reasonix-desktop.exe
          node packaging/package.mjs windows/amd64 v0.0.0-ci canary

      - name: Smoke-test Electron native startup
        timeout-minutes: 3
        run: node packaging/smoke.mjs build/electron/windows-amd64/app --service build/bin/reasonix-desktop.exe

      - name: Test native window geometry on Windows
        timeout-minutes: 2
        run: node electron/scripts/window-geometry-smoke.mjs

      - name: Test native graphics recovery
        timeout-minutes: 3
        run: node electron/scripts/graphics-recovery-smoke.mjs

      - name: Test native browser foreground runtime
        timeout-minutes: 3
        run: node electron/scripts/browser-runtime-smoke.mjs

      - name: Upload Windows browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-windows
          path: desktop/electron/artifacts/browser-runtime/
          if-no-files-found: warn

      - name: Test transcript content bounds in native Electron
        timeout-minutes: 5
        env:
          REASONIX_LAYOUT_ARTIFACTS: ${{ runner.temp }}/transcript-layout-electron
        run: pnpm --dir frontend test:transcript-electron

      - name: Upload native transcript layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transcript-layout-electron-windows
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/transcript-layout-electron

      - name: Test bounded Electron diagnostics
        timeout-minutes: 3
        run: node electron/scripts/performance-smoke.mjs

  # The desktop Go suite shares nothing with the Electron and browser steps
  # beyond a built frontend for go:embed, and it is the leg's longest step by
  # far: the module that tests in 1.8 minutes on ubuntu takes ~17 on Windows,
  # ~11 of them compiling and linking the cgo-heavy root package before a
  # single test runs (GOCACHE restored, Defender excluded). Running it beside
  # the Electron steps makes the leg's wall time the longer half rather than
  # the sum, and a Go flake reruns only this job.
  desktop-windows-go-group:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false') }}
    runs-on: windows-latest
    # Independent runners prevent valid groups from consuming each other's
    # step deadline. Go retains its default per-package ten-minute timeout.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [A-B, C, D, E-H, I-P, Q-S, T-Z, history-3-5, history-6-7, history-8-9, history-10-11]
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Same Defender hazard as the Electron leg: exclusions keep Go test
      # binaries from crashing mid-syscall and freshly written files readable.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.stable_artifact_name }}
          path: desktop/frontend
      - name: Verify stable frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"

      - name: Validate Windows test partition
        run: node --test ../scripts/desktop-windows-go-tests.test.mjs

      - name: test (Windows desktop and update helper)
        # Keep native Go output here. JSON mode forces verbose output into the
        # test cache and spent 8-10 minutes finalizing it on Windows runners.
        timeout-minutes: 25
        # The driver checks the current native inventory for unique ownership.
        run: node ../scripts/desktop-windows-go-tests.mjs ${{ matrix.group }}

      # ConPTY startup and teardown depend on the hosted runner's interactive
      # Windows environment. Keep the end-to-end probe visible without making
      # a single host scheduling stall equivalent to a Go correctness failure.
      - name: probe (Windows ConPTY host integration)
        if: matrix.group == 'T-Z'
        id: conpty-smoke
        continue-on-error: true
        timeout-minutes: 2
        run: go test -run '^TestWindowsTerminalProcessConPTYSmoke$' .

      - name: report ConPTY probe failure
        if: always() && matrix.group == 'T-Z' && steps.conpty-smoke.outcome == 'failure'
        shell: bash
        run: echo "::warning::The hosted Windows ConPTY integration probe failed; deterministic Windows Go tests still passed."

      - name: test (vendored systray identity)
        if: matrix.group == 'T-Z'
        timeout-minutes: 2
        run: go test -timeout=60s fyne.io/systray

  desktop-windows-go:
    needs: [changes, desktop-prepare, desktop-windows-go-group]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows desktop Go groups
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.native != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GROUP_RESULT: ${{ needs.desktop-windows-go-group.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SHOULD_RUN" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$GROUP_RESULT" = success
          else
            test "$GROUP_RESULT" = skipped
          fi

  # Installer packaging is packaging validation, not a code gate, and it shares
  # no state with the test steps above. It runs beside them instead of after
  # them so the Windows leg's wall time is the longer half rather than the sum,
  # and so a packaging failure costs a short rerun instead of the whole leg.
  # Packaging changes also qualify before merge, so installer/upgrade failures
  # cannot first appear on the release candidate's push.
  desktop-windows-package:
    needs: [changes, desktop-prepare]
    if: ${{ !cancelled() && needs.desktop-prepare.result == 'success' && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.packaging != 'false') }}
    runs-on: windows-latest
    # Bound packaging hangs; diagnostic measurement has its own workflow.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Same Defender hazard as the test leg: exclusions keep packaging from
      # tripping over freshly written files that are still held open.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.canary_artifact_name }}
          path: desktop/frontend
      - name: Verify canary frontend artifact
        run: |
          test -n "${{ needs.desktop-prepare.outputs.producer_attempt }}"
          node frontend/scripts/artifact-identity.mjs verify \
            --shell electron --channel canary \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "${{ needs.desktop-prepare.outputs.producer_attempt }}" \
            --pnpm-version "$(pnpm --version)"

      - name: Install NSIS
        run: pwsh -NoProfile -File ../scripts/install-nsis.ps1

      - name: Verify uninstaller-only compilation preserves the shared uninstaller
        run: node ../scripts/check-windows-uninstaller.mjs

      - name: Build Windows installer and portable archive
        timeout-minutes: 20
        env:
          REASONIX_PACKAGE_REUSE_FRONTEND: "1"
          REASONIX_FRONTEND_PRODUCER_ATTEMPT: ${{ needs.desktop-prepare.outputs.producer_attempt }}
        run: |
          REASONIX_FRONTEND_PNPM_VERSION="$(pnpm --version)"
          export REASONIX_FRONTEND_PNPM_VERSION
          ../scripts/desktop-build.sh windows/amd64 v0.0.0-ci canary

      - name: Verify packaged Windows artifacts
        run: |
          node packaging/verify.mjs ../dist/Reasonix-windows-amd64.zip
          node packaging/signing-files.mjs build/windows/signing-payload --check

      - name: Install and smoke-test Windows installer identity
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" ./cmd/windows-upgrade-fixture
          ../scripts/test-windows-installer-startup.ps1 `
            -InstallerPath ../dist/Reasonix-windows-amd64-installer.exe `
            -ExpectedVersion v0.0.0-ci `
            -FixtureBuilderPath "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" `
            -EvidenceDirectory "$env:RUNNER_TEMP/reasonix-installer-acceptance"

      - name: Upload Windows installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.json
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.png
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.log
            !${{ runner.temp }}/reasonix-installer-acceptance/installed/**
            !${{ runner.temp }}/reasonix-installer-acceptance/**/cache/**
          if-no-files-found: ignore
          retention-days: 7

  ci-metrics:
    needs: [desktop, desktop-macos, desktop-windows, desktop-windows-go, desktop-windows-package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Summarize queue, execution and stage timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          node scripts/ci-timings.mjs \
            --run "$RUNNER_TEMP/ci-run.json" \
            --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --title "Frontend CI timing"

  # Every main-v2 push saves one Go cache per Unix OS and module (~2.6 GiB
  # measured) against a 10 GiB repository limit shared with pnpm, CodeQL and
  # setup-go caches; two pushes filled it. Keep only the newest cache per
  # prefix once the savers are done; restore-keys pick the newest anyway.
  prune-go-cache:
    needs: [test, race, desktop-go, desktop-go-race, desktop-macos]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the newest Go cache per OS and module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A seen
          while read -r id key; do
            [ -n "$id" ] || continue
            prefix="${key%-*-*-*}"
            if [ -n "${seen[$prefix]:-}" ]; then
              echo "deleting older cache $key"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null
            else
              seen[$prefix]=1
              echo "keeping newest cache $key"
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&sort=created_at&direction=desc" --paginate \
            --jq '.actions_caches[] | select(.key | startswith("go-")) | "\(.id) \(.key)"')

  # repolint scans desktop/ and sdk/ too, so this job also runs for diffs the
  # `code` filter would otherwise skip.
  lint-code:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: repo standards
        run: go run ./tools/repolint

      # `make lint-install` reads the same file, so a local run and this job
      # cannot drift onto different linter versions.
      - id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      # The step above only type-checks the linux/amd64 build, so every
      # //go:build windows and //go:build darwin file in the tree went unlinted.
      # Both modules cross-check without a toolchain; desktop under darwin does
      # not, because its bundle icon repair is cgo, so that leg lives in
      # desktop-macos.
      - name: golangci-lint (cross-platform build tags)
        run: |
          set -euo pipefail
          command -v golangci-lint
          for target in "darwin ." "windows ." "windows desktop"; do
            read -r target_os target_dir <<< "$target"
            echo "::group::golangci-lint GOOS=$target_os ($target_dir)"
            (cd "$target_dir" && GOOS="$target_os" golangci-lint run --timeout=5m ./...)
            echo "::endgroup::"
          done

  release-control:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.release_control != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Validate release workflows and executable contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            -ignore 'label "macos-15-intel" is unknown' \
            .github/workflows/release-stable.yml \
            .github/workflows/prepare-release-notes.yml \
            .github/workflows/release-candidate.yml \
            .github/workflows/release-candidate-verify.yml \
            .github/workflows/release-promote.yml \
            .github/workflows/release-verify.yml \
            .github/workflows/release-site-recovery.yml \
            .github/workflows/release.yml \
            .github/workflows/release-desktop.yml \
            .github/workflows/pages.yml \
            .github/workflows/apple-notary-log.yml \
            .github/workflows/macos-signing-check.yml \
            .github/workflows/release-verify-issues.yml \
            .github/workflows/docs-impact.yml \
            .github/workflows/ci.yml
          node --test scripts/release-candidate.test.mjs scripts/resolve-release-candidate.test.mjs \
            scripts/verify-release-artifact-archive.test.mjs \
            scripts/build-release-cli-candidate.test.mjs \
            scripts/desktop-release-artifacts.test.mjs scripts/release-publication-ledger.test.mjs \
            scripts/ci-paths.test.mjs scripts/ci-workflow.test.mjs scripts/macos-go-tests.test.mjs \
            scripts/desktop-windows-go-tests.test.mjs \
            npm/publish.test.mjs
          bash scripts/validate-release-candidate-source.test.sh
          bash scripts/validate-release-control-plane.test.sh
          bash scripts/verify-release-push-ci.test.sh
          bash scripts/release-stable.test.sh
          bash scripts/release-candidate-tags.test.sh
          node --test scripts/verify-release-tag-identity.test.mjs
          bash scripts/verify-release-authorization.test.sh
          bash scripts/release-workflows.test.sh
          node scripts/check-single-release-public-contract.mjs

  # `lint` is a protected check name. Keep it as the fail-closed aggregate so
  # Required check for the root-module and site jobs the per-OS `test` legs do
  # not cover. windows-control and sdk gate internally through RUN_STEPS and so
  # always report a result: `success` here means "did not fail", not "validated
  # this diff" — the same trade-off the required `test` legs already make. Do
  # not add govulncheck: it sets continue-on-error, so needs.*.result is
  # `success` even when its steps fail and the assertion would be a tautology.
  root:
    needs: [changes, windows-control, windows-isolated, sdk, site, coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify root validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' }}
          SITE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.site != 'false' }}
          COVERAGE_REQUIRED: ${{ github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true' }}
          CONTROL_RESULT: ${{ needs.windows-control.result }}
          ISOLATED_RESULT: ${{ needs.windows-isolated.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          SITE_RESULT: ${{ needs.site.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$CHANGES_RESULT" = success
          expected() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          test "$CONTROL_RESULT" = success
          test "$SDK_RESULT" = success
          test "$ISOLATED_RESULT" = "$(expected "$CODE_REQUIRED")"
          test "$SITE_RESULT" = "$(expected "$SITE_REQUIRED")"
          test "$COVERAGE_RESULT" = "$(expected "$COVERAGE_REQUIRED")"

  # frontend unit coverage can run once in desktop-frontend without weakening
  # the branch gate.
  lint:
    needs: [changes, lint-code, release-control, desktop-prepare, desktop-frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and frontend validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_CODE_RESULT: ${{ needs.lint-code.result }}
          LINT_CODE_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false' }}
          RELEASE_CONTROL_RESULT: ${{ needs.release-control.result }}
          RELEASE_CONTROL_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.release_control != 'false' }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          FRONTEND_REQUIRED: ${{ (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.frontend != 'false' || needs.changes.outputs.electron != 'false' }}
        run: |
          test "$CHANGES_RESULT" = success
          expected() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          lint_expected=skipped
          if [ "$LINT_CODE_REQUIRED" = true ]; then lint_expected=success; fi
          test "$LINT_CODE_RESULT" = "$lint_expected"
          test "$RELEASE_CONTROL_RESULT" = "$(expected "$RELEASE_CONTROL_REQUIRED")"
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_RESULT" = skipped
          fi

  # The site/ auth client has security-sensitive redirect-validation logic
  # (safeNext) covered by node:test unit tests. Those tests use only Node
  # builtins, so no `npm install` is needed — run them directly on every PR so
  # a regression in redirect validation fails the build instead of shipping.
  # The notes_only term matches every other gated job here. Without it a
  # release-notes-only push runs this job while the root aggregate expects the
  # house-style skip, which would leave main-v2 permanently red. A pure
  # release-notes/** diff cannot touch site/, so skipping it loses no coverage.
  site:
    needs: changes
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') || needs.changes.outputs.site != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: test
        run: npm test

  govulncheck:
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true')
    runs-on: ubuntu-latest
    continue-on-error: true # informational — stdlib vulns need a Go patch release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  # `always()` matches every other gated job: a failed changes job makes this
  # run the full sweep instead of silently reporting skipped to the aggregate.
  coverage:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' && needs.changes.outputs.notes_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache
        id: gocache
        with:
          module: root

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true

      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
