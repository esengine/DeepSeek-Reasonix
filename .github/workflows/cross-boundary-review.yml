name: Cross-boundary review gate

# Large changes or changes spanning multiple architectural owners are easy to
# validate by aggregate CI while missing a small contract migration. Evaluate
# them only from the protected default-branch control plane. Review workflows
# on the candidate ref may request reevaluation, but they cannot decide or
# publish the result.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Cross-boundary review signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to reevaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  independent-review:
    name: publish independent cross-boundary review status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected review policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: review-control
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/review-control/.github/scripts/cross-boundary-review.cjs`);
            await gate({ github, context, core });
