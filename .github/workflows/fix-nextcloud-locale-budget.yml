name: Fix Nextcloud locale bundle budget

on:
  push:
    branches:
      - feature/nextcloud-talk-bot
    paths:
      - .github/workflows/fix-nextcloud-locale-budget.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nextcloud-talk-bot
          fetch-depth: 0

      - name: Trim locale copy and push
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "desktop/frontend/src/locales/zh.ts": {
                  '"settings.botInstallNextcloudHint": "通过签名 Webhook 连接自托管 Talk Bot。"': '"settings.botInstallNextcloudHint": "签名 Webhook 连接 Talk Bot。"',
                  '"settings.botInstallManualNextcloud": "填写 Nextcloud 服务器和 Webhook 设置。注册 Talk Bot 时请使用相同的共享密钥。"': '"settings.botInstallManualNextcloud": "填写 Nextcloud 与 Webhook 设置，共用同一密钥。"',
                  '"settings.botNextcloudListenAddr": "Webhook 监听地址"': '"settings.botNextcloudListenAddr": "Webhook 地址"',
                  '"settings.botNextcloudSecretEnv": "共享密钥环境变量"': '"settings.botNextcloudSecretEnv": "密钥环境变量"',
                  '"settings.botNextcloudSetupHelp": "使用相同的 Webhook 路径和共享密钥执行 occ talk:bot:install。若 Nextcloud 位于其他主机，请通过 HTTPS 反向代理暴露此监听端点。"': '"settings.botNextcloudSetupHelp": "用同一路径和密钥注册 Talk Bot；远程 Nextcloud 请用 HTTPS 反代。"',
              },
              "desktop/frontend/src/locales/zh-TW.ts": {
                  '"settings.botInstallNextcloudHint": "透過簽名 Webhook 連接自架 Talk Bot。"': '"settings.botInstallNextcloudHint": "簽名 Webhook 連接 Talk Bot。"',
                  '"settings.botInstallManualNextcloud": "填寫 Nextcloud 伺服器與 Webhook 設定。註冊 Talk Bot 時請使用相同的共享密鑰。"': '"settings.botInstallManualNextcloud": "填寫 Nextcloud 與 Webhook 設定，共用同一密鑰。"',
                  '"settings.botNextcloudListenAddr": "Webhook 監聽位址"': '"settings.botNextcloudListenAddr": "Webhook 位址"',
                  '"settings.botNextcloudSecretEnv": "共享密鑰環境變數"': '"settings.botNextcloudSecretEnv": "密鑰環境變數"',
                  '"settings.botNextcloudSetupHelp": "使用相同的 Webhook 路徑與共享密鑰執行 occ talk:bot:install。若 Nextcloud 位於其他主機，請透過 HTTPS 反向代理公開此監聽端點。"': '"settings.botNextcloudSetupHelp": "用同一路徑與密鑰註冊 Talk Bot；遠端 Nextcloud 請用 HTTPS 反代。"',
              },
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f"missing expected locale text in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-nextcloud-locale-budget.yml
          git add desktop/frontend/src/locales/zh.ts desktop/frontend/src/locales/zh-TW.ts
          git commit -m "fix(ui): keep Nextcloud locale chunk within budget"
          git push origin feature/nextcloud-talk-bot
