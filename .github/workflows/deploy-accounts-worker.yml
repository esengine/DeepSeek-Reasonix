name: Deploy identity and remote services

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-identity-and-remote-services
  cancel-in-progress: false

jobs:
  deploy-accounts:
    if: github.ref == 'refs/heads/platform'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workers/accounts/pnpm-lock.yaml
      - name: Deploy
        working-directory: workers/accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm db:apply:remote
          npx wrangler deploy
      - name: Sync RESEND_API_KEY to the worker
        working-directory: workers/accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY not set in repo secrets; skipping (worker stays in stub email mode)."
          fi
      - name: Sync remote gateway secret
        working-directory: workers/accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REMOTE_GATEWAY_TOKEN: ${{ secrets.REMOTE_GATEWAY_TOKEN }}
        run: |
          if [ -z "$REMOTE_GATEWAY_TOKEN" ]; then
            echo "REMOTE_GATEWAY_TOKEN must be configured before enabling remote access."
            exit 1
          fi
          printf '%s' "$REMOTE_GATEWAY_TOKEN" | npx wrangler secret put REMOTE_GATEWAY_TOKEN
      - name: Sync feedback account secret
        working-directory: workers/accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEEDBACK_ACCOUNT_SECRET: ${{ secrets.FEEDBACK_ACCOUNT_SECRET }}
        run: |
          if [ -n "$FEEDBACK_ACCOUNT_SECRET" ]; then
            printf '%s' "$FEEDBACK_ACCOUNT_SECRET" | npx wrangler secret put FEEDBACK_ACCOUNT_SECRET
          else
            echo "FEEDBACK_ACCOUNT_SECRET not set in repo secrets; feedback account linking stays unavailable."
          fi

  deploy-remote-gateway:
    needs: deploy-accounts
    if: github.ref == 'refs/heads/platform'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/remote-gateway/package-lock.json
      - name: Validate gateway secret
        env:
          REMOTE_GATEWAY_TOKEN: ${{ secrets.REMOTE_GATEWAY_TOKEN }}
        run: test -n "$REMOTE_GATEWAY_TOKEN"
      - name: Validate and deploy
        working-directory: workers/remote-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npm test
          npm run typecheck
          npx wrangler deploy
      - name: Sync gateway secret
        working-directory: workers/remote-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REMOTE_GATEWAY_TOKEN: ${{ secrets.REMOTE_GATEWAY_TOKEN }}
        run: printf '%s' "$REMOTE_GATEWAY_TOKEN" | npx wrangler secret put REMOTE_GATEWAY_TOKEN
