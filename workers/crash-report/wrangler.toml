# Deploy: wrangler d1 create reasonix-crash → paste database_id → wrangler deploy.
name = "reasonix-crash-report"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# workers.dev serves only the feedback converter's admin paths (src/workersdev_gate.ts).
workers_dev = true
preview_urls = false
routes = [{ pattern = "crash.reasonix.io", custom_domain = true }]

# First entry: daily retention purge (03:47 Beijing) — drops time-series rows
# past the dashboard's query horizon so the D1 database plateaus instead of
# hitting the size cap and failing every ingest write (purgeExpiredStatsRows).
# Second entry: ingest sentinel four times a day (runIngestSentinel) — canary
# write + checkpointed ping growth; alerts via the optional ALERT_WEBHOOK worker
# secret, log-only when unset. The secret is mirrored from the GitHub repo
# secret of the same name by deploy-crash-worker.yml on every deploy — set it
# under repo Settings → Secrets → Actions, no Cloudflare login needed. The
# sentinel expression must stay in sync with SENTINEL_CRON in src/index.ts.
[triggers]
crons = ["47 19 * * *", "17 1,7,13,19 * * *"]

[vars]
# Safe rollout default. Change to `dual` only after the Firebase database URL
# and service-account secrets have been installed; use `firebase` after the
# seven-day shadow comparison completes.
CRASH_STORAGE_MODE = "d1"
OPS_EVENTS_URL = "https://reasonix-ops-events.reasonix.workers.dev"
# Emails force-promoted to dashboard admin — the owner is never locked out even
# if the role migration misses them.
ADMIN_EMAILS = "359807859@qq.com"
# Shared identity service (resolves the session) and the site hosting its login
# page. Override for local dev.
ID_ORIGIN = "https://id.reasonix.io"
APP_ORIGIN = "https://reasonix.io"
# Browsers allowed to call the folded registry API with credentials.
ALLOWED_ORIGINS = "https://reasonix.io,https://www.reasonix.io"
# Kill switch for in-app feedback: "false" answers feedback.disabled. The feature
# is also off while either worker secret is unset. Secrets (never in this file):
#   FEEDBACK_TOKEN_SECRET  keys install hashes and read tokens; rotating it
#                          invalidates every token AND changes every install
#                          hash, so users lose their /mine history
#   FEEDBACK_ADMIN_TOKEN   bearer for the converter's /v1/admin/feedback endpoints
#   FEEDBACK_TURNSTILE_SECRET  optional; when set, submissions need a Turnstile token
#                          with action "feedback" (hostname list: FEEDBACK_TURNSTILE_HOSTNAMES)
FEEDBACK_ENABLED = "true"
# Account link kill switch: "true" turns on the /v1/feedback/link routes, the union
# read and replies from linked sibling installs; anything else leaves them absent.
# Needs the FEEDBACK_ACCOUNT_SECRET secret, shared with the accounts worker.
FEEDBACK_ACCOUNT_LINK = "false"
TELEMETRY_QUEUE_ENABLED = "true"
# CLI/Studio reads and writes use the isolated telemetry database. `dual` and
# `legacy` remain available as rollback modes; the verified legacy copy is kept
# temporarily after cutover.
TELEMETRY_DB_MODE = "isolated"
# Desktop reads and writes use the isolated telemetry database. The verified
# legacy copy remains intact as a rollback path after cutover.
DESKTOP_TELEMETRY_DB_MODE = "isolated"

[[d1_databases]]
binding = "DB"
database_name = "reasonix-crash"
database_id = "54825184-366f-4877-80fc-924efab0239b"

# Independent write plane for CLI and Studio launch/aggregate telemetry. The
# legacy desktop tables remain in DB because diagnostic attribution still joins
# against them.
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "reasonix-telemetry"
database_id = "59562e60-c106-4fee-974a-a1ac6b2c5a48"

# Skill/MCP registry data plane, folded in from the standalone worker. Before
# the first platform deployment:
#   wrangler d1 create reasonix-registry   # paste the id below
#   wrangler d1 execute reasonix-registry --remote --file=registry-schema.sql
[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "reasonix-registry"
database_id = "83786761-5cc5-487d-8624-5cf565d1a57c"

[[queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "reasonix-telemetry-ingest"

[[queues.consumers]]
queue = "reasonix-telemetry-ingest"
max_batch_size = 100
max_batch_timeout = 10
max_retries = 2
dead_letter_queue = "reasonix-telemetry-dlq"
max_concurrency = 1

[[r2_buckets]]
binding = "TELEMETRY_RAW"
bucket_name = "reasonix-telemetry-raw"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Looser than RATE_LIMITER: many installs can share one office/campus NAT IP.
[[unsafe.bindings]]
name = "PING_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Opt-in metrics flush fires once per launch like the ping; its own bucket so it
# never eats the ping budget on a shared NAT IP.
[[unsafe.bindings]]
name = "METRICS_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "TELEMETRY_BUDGET_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 1000, period = 60 }

# Per-IP throttle for registry writes (publish / install-ping / star).
[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 30, period = 60 }

# Per-IP throttle for feedback submissions; hourly and daily caps live in D1.
[[unsafe.bindings]]
name = "FEEDBACK_LIMITER"
type = "ratelimit"
namespace_id = "5001"
simple = { limit = 6, period = 60 }

# Global admission ceiling for feedback, independent of IP.
[[unsafe.bindings]]
name = "FEEDBACK_BUDGET_LIMITER"
type = "ratelimit"
namespace_id = "5002"
simple = { limit = 60, period = 60 }
