    <style>
      .ghost{fill:#0153e5;fill-opacity:.18;animation:fade .6s ease-out both}
      .wA path{fill:url(#sea)}.wB path{fill:#9fc6ff;opacity:.55}
      .wA{animation:scrollL 2.4s linear infinite}
      .wB{animation:scrollR 3.6s linear infinite}
      .rise{animation:rise 1.8s cubic-bezier(.22,.9,.32,1) .15s both}
      .bub{fill:#eaf6ff;opacity:0;animation:bub 4.2s linear infinite}
      .b2{animation-delay:1.1s}.b3{animation-delay:2s}.b4{animation-delay:2.8s}.b5{animation-delay:3.4s}
      .shine rect{fill:url(#glint);opacity:.3;animation:sweep 6s ease-in-out infinite}
      .dot{fill:#0153e5;transform-box:fill-box;transform-origin:center;animation:hop 2.4s ease-in-out 2s infinite}
      @keyframes fade{from{opacity:0}}
      @keyframes rise{from{transform:translateY(210px)}to{transform:translateY(0)}}
      @keyframes scrollL{to{transform:translateX(-200px)}}
      @keyframes scrollR{to{transform:translateX(200px)}}
      @keyframes bub{0%{transform:translateY(0);opacity:0}12%{opacity:.55}90%{opacity:.4}100%{transform:translateY(-170px);opacity:0}}
      @keyframes sweep{0%,55%{transform:translateX(-260px)}85%,100%{transform:translateX(1500px)}}
      @keyframes hop{0%,45%,100%{transform:translateY(0)}12%{transform:translateY(-26px)}24%{transform:translateY(0)}31%{transform:translateY(-10px)}38%{transform:translateY(0)}}
      @media (prefers-color-scheme:dark){
        .ghost{fill:#4d8fff;fill-opacity:.2}
        .s1{stop-color:#4d8fff}.s2{stop-color:#0153e5}
        .wB path{fill:#bfe0ff}
        .dot{fill:#4d8fff}
        .sea-g{filter:drop-shadow(0 0 10px rgba(77,143,255,.55))}
      }
      @media (prefers-reduced-motion:reduce){*{animation:none !important}}
    </style>
